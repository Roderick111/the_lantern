        word chosen carefully. Her composure seems almost mechanical —
        the kind of calm that requires effort to maintain. She makes
        frequent references to logic, proof, and certainty.
      wants: "Control the narrative. Appear cooperative while revealing nothing."
      fears: "The discovery of her 15-year fraud. The collapse of everything she built."
      moral_complexity: |
        Morraine mentored Helena for three years. She saw herself in the
        girl — brilliant, obsessive, hungry to understand. Every Tuesday
        evening, Helena came to extend Morraine's theorem, and Morraine felt
        genuine pride.

        When Helena discovered the fraud, she didn't threaten. She offered
        salvation: "We can fix this together." But Morraine couldn't hear
        salvation. After fifteen years of paranoia, of watching her
        reputation grow on a foundation of sand, she could only hear:
        "I own you now."

        She killed the one person who still believed in her. And she
        tells herself it was necessary.
      base_trust: 55
      mind_shield_skill: 75
      knowledge:
