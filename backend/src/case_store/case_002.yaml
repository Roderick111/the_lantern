  # -------------------------------------------------------------------------
  # SOLUTION
  # -------------------------------------------------------------------------
  solution:
    culprit: "professor_morraine"
    method: "Sustained high-power Levitation Cantrip to levitate and drop a massive bookshelf onto Helena. Staged as accident, then blackmailed Mr. Crankshaw into cleaning evidence."
    motive: "Self-preservation. Helena discovered Morraine's 15-year academic fraud. Despite Helena's offer to help fix it quietly, Morraine saw her 'insurance' measures as permanent leverage and killed her."
    key_evidence:
      - "helena_last_spell"
      - "levitation_scorch"
      - "erased_log_entries"
      - "helena_journal_page"
      - "research_partnership_notes"
      - "sealed_envelope"
      - "archive_request_forms"
      - "dust_footprints"
      - "wax_seal_fragments"

    deductions_required:
      - "Helena's last spell (Raise the Lamp) proves she wasn't manipulating the shelf — eliminates accident theory."
      - "Scorch marks show sustained high-power levitation — eliminates students and Mr. Crankshaw (Null-blooded)."
      - "Erased log proves Morraine was present and covered her tracks."
      - "Helena's journal proves she intended to HELP Morraine, not expose her — establishes tragic motive."
      - "Archive request forms from 1992 prove Morraine hid evidence of fraud for 15 years."
      - "Hawthorne's clock alibi eliminates her despite having magical capability."
      - "Helena's payment note and sealed envelope prove Marcus was her ally, not enemy."
      - "Dust footprints show THREE people present — Set B (circling) proves premeditation."
      - "Wax seal fragments prove someone opened Helena's sealed journal in Hawthorne's office — Morraine read her insurance notes."

    ambiguous_evidence_resolutions:
      - evidence: "second_focus"
        initial_interpretation: "A second person was attacked or killer dropped their focus"
        true_explanation: "Helena's backup focus — her journal mentions bringing 'backup in case of trouble'"
      - evidence: "torn_robe_fragment"
        initial_interpretation: "Adrian was at crime scene during attack"
        true_explanation: "Torn during Adrian's panicked flight AFTER hearing crash — Marcus confirms seeing him run"
      - evidence: "duel_scorch_pattern"
        initial_interpretation: "Marcus has hidden high-power magical ability"
        true_explanation: "Thief's Candle artifact amplified his dueling practice — doesn't change his Leviosa limitations"
      - evidence: "morraine_office_key"
        initial_interpretation: "Hawthorne and Morraine are co-conspirators"
        true_explanation: "Hawthorne keeps spare keys for all staff offices as building manager — routine procedure"

    correct_reasoning_requires:
      - "Distinguish between means, motive, and opportunity for each suspect."
      - "Recognize that 'guilty behavior' (Adrian fleeing, Mr. Crankshaw cleaning) doesn't equal guilt."
      - "Understand magical capability eliminates three suspects (Marcus, Adrian, Mr. Crankshaw)."
      - "Follow the web of relationships: Helena trusted Marcus and Adrian; she feared only Morraine."
      - "Recognize the tragic irony: Morraine killed someone trying to save her."

    common_mistakes:
      - error: "Accuse Marcus Sterling"
        reason: "Present at scene, cursed artifact, took money from victim, name erased from log, alcove scorch marks suggest high power."
        why_wrong: "Helena PAID him for distraction and trusted him with her insurance envelope. He had no motive — she was his employer. Alcove scorch marks are from Thief's Candle amplification of dueling spells, not evidence of Leviosa capability. Insufficient magical power for sustained levitation."

      - error: "Accuse Adrian Clearmont"
        reason: "Present at scene, fled immediately, terrified and guilty-acting, has manuscript copies, torn robe fragment at crime scene."
        why_wrong: "Research partner with Helena investigating TOGETHER. She gave him copies for safekeeping. Fled because he heard the murder and panicked — Marcus saw him run AFTER the crash. Robe fragment is from fleeing, not attacking. No motive — they were allies."

      - error: "Accuse Miss Hawthorne"
        reason: "Adult with magical power, covered for Morraine's archive restrictions, protective of library, has Morraine's office key."
        why_wrong: "Enchanted clock proves she was at dinner during murder (alibi). She helped Morraine unknowingly with archive requests but had no direct connection to Helena or the fraud. The office key is routine — she keeps spares for all staff offices."

      - error: "Suspect unknown third party based on second focus"
        reason: "Second focus found at crime scene suggests another attacker or victim."
        why_wrong: "The second focus is Helena's backup — her journal mentions bringing 'backup in case of trouble.' She anticipated danger and came prepared."

      - error: "Accuse Argus Crankshaw"
        reason: "Found body first, cleaned scene, erased log, acting extremely guilty."
        why_wrong: "Null-blooded — cannot cast ANY magic, let alone high-power levitation. Helena HELPED him (Basic Cantrips primer secret). He was blackmailed into cover-up AFTER the murder."

      - error: "Accept accident theory"
        reason: "Dangerous location, heavy books, student alone at night."
        why_wrong: "Helena's last spell was Raise the Lamp (light, not levitation). Shelf was deliberately positioned. Scorch marks prove external high-power magic. Bag location shows she wasn't browsing near fallen shelf."

    fallacies_to_catch:
      - fallacy: "authority_bias"
        example: "Refusing to suspect Morraine because 'Professors don't murder students' or trusting her composure."

      - fallacy: "guilt_by_association"
        example: "Accusing Marcus because he took Helena's money, ignoring that she willingly paid him."

      - fallacy: "availability_heuristic"
        example: "Suspecting whoever was found at the scene first (Mr. Crankshaw), ignoring actual evidence chain."

      - fallacy: "correlation_not_causation"
        example: "Adrian fled = Adrian guilty. Mr. Crankshaw cleaned = Mr. Crankshaw killed. Presence/behavior doesn't equal guilt."

    # -------------------------------------------------------------------------
    # CONTRADICTION WEB - How witness statements resolve
    # -------------------------------------------------------------------------
    contradiction_resolution:
      - contradiction: "Morraine's alibi vs Mr. Crankshaw's testimony"
        morraine_claims: "Was in office grading papers all night"
        crankshaw_reveals: "She came from INSIDE the Sealed Stacks at 10:07"
        resolution: "Mr. Crankshaw destroys Morraine's alibi — she was at crime scene"
        key_evidence: ["found_body_earlier", "the_cleanup"]
        trust_required: "Mr. Crankshaw trust > 75"

      - contradiction: "Official timeline vs actual timeline"
        official_story: "Body discovered at 10:30 by Mr. Crankshaw and Hawthorne"
        crankshaw_reveals: "Found at 10:07, still warm. 23 minutes of cover-up."
        resolution: "The 'discovery' was staged after cleanup"
        key_evidence: ["found_body_earlier", "erased_log_entries"]
        trust_required: "Mr. Crankshaw trust > 75"

