        - "She had been working on extending my 1991 theorem."
        - "I was grading papers in my office all night. Terrible tragedy."
        - "The Sealed Stacks can be dangerous. Those old shelves..."
        - "That Clearmont boy was always hovering around Helena. I assumed it was a schoolboy crush. Now I wonder."
