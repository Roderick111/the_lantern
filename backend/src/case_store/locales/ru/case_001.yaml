  solution:
    method: "Связывающие чары домового легли поверх выброса Свечи Вора. Обряд Касьяна оглушил Вежина. Магия Тихона довела неподвижность до конца."
    motive: "Старший господин Мстислав велел Тихону любой ценой защищать Касьяна. Тихон подчинился. Он хотел задержать профессора, а два воздействия навсегда остановили его."
    deductions_required:
      - "Два оттенка магии на Вежине указывают на отдельные воздействия."
      - "Признание Касьяна: когда он убежал, Вежин ещё двигался, значит, кто-то завершил нападение."
      - "Запись на кухне и обморожение на руках Тихона помещают его у библиотеки в нужный момент."
      - "Письмо Мстислава объясняет приказ, которому Тихон не мог ослушаться."
      - "След связывающей магии домового совпадает со вторым отблеском на теле Вежина."
      - "Елена была в дальней нише до и во время нападения; её чары не совпадают с двумя следами на Вежине."
      - "Касьян виновен в опасном обряде. Полное связывание завершил Тихон."
    correct_reasoning_requires:
      - "Поставить под сомнение версию об одном магическом воздействии."
      - "Увидеть в двойном отблеске следы двух участников."
      - "Сопоставить промежуток 22:02–22:05 с отсутствием Тихона на кухне."
      - "Соединить обморожение Тихона, запись на кухне и приказ Мстислава."
      - "Понять, что Тихон подневольный и всё же применил второе заклинание."
