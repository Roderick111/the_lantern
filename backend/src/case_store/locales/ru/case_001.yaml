  solution:
    method: "Связывающие чары фамильяра легли поверх выброса Свечи Вора. Обряд Кассиана оглушил Вейна, а магия Виспа довела неподвижность до конца. Два заклинания наложились друг на друга."
    motive: "Рабство и приказ. Лорд Магнус велел Виспу любой ценой защищать Кассиана. Висп подчинился, не понимая, что два воздействия навсегда остановят профессора."
    deductions_required:
      - "Два оттенка магии на Вейне означают два отдельных воздействия, а не один обряд."
      - "Признание Кассиана: когда он убежал, Вейн ещё двигался — значит, кто-то завершил нападение."
      - "Запись на кухне и обморожение на руках Виспа помещают его у архива в нужный момент."
      - "Письмо Магнуса объясняет приказ, которому Висп не мог ослушаться."
      - "След связывающей магии фамильяра совпадает со вторым отблеском на теле Вейна."
      - "Елена была в дальней нише до и во время нападения; её чары не совпадают с двумя следами на Вейне."
      - "Кассиан виновен в опасном обряде, но не довёл связывание до конца."
    correct_reasoning_requires:
      - "Поставить под сомнение версию об одном магическом воздействии."
      - "Увидеть в двойном отблеске следы двух участников."
      - "Сопоставить промежуток 22:02–22:05 с отсутствием Виспа на кухне."
      - "Соединить обморожение Виспа, запись на кухне и приказ Магнуса."
      - "Понять, что Висп одновременно подневольный и тот, кто применил второе заклинание."
