case:
  id: "case_001"
  title: "Запечатанный архив"
  description: >
    Профессор Олдрик Вейн застыл посреди библиотечного архива. Трое
    подозреваемых, две кражи и заклинание, которое никто не признаёт своим.
    Первый ответ кажется очевидным. Поэтому доверять ему нельзя.
  setting: "Блэквудский колледж, осень 1890 года"
  crime_scene: "Запечатанный архив"
  hook: >
    Профессор застыл с вытянутой рукой, будто пытался остановить кого-то, а не
    защититься. Одна ученица поссорилась с ним. Другой принёс в школу проклятый
    артефакт. Фамильяр, которого никто не считает человеком, просто хотел помочь.
    У каждого есть своя вина. Вопрос в том, чья вина стала преступлением.
  twist: "Обряд Кассиана оглушил профессора, но не остановил его. Висп, всё ещё подневольный и исполнявший приказ Магнуса, наложил связывающие чары фамильяра. Два воздействия сошлись, а все решили, что виновата одна Свеча Вора."
  world_context: |
    Вы расследуете дело Королевского бюро сверхъестественных расследований.
    Орден Светочей — его полевая служба для дел, до которых обычная полиция не
    добирается. Свидетелей держат в школе, архив заперт, а руководство колледжа
    мечтает о тихом исходе.

    Блэквудский колледж живёт слухами. Три ночи назад кто-то повредил защиту
    восточной ниши архива. В прошлом месяце на парапете нашли окоченевшего
    ворона смотрителя. На стенах появились надписи о борьбе за наследство
    Железного дома. Ученики из семей без дара боятся лишний раз поднять глаза.

    Железный дом — один из старых ученических домов Блэквуда; его наследники
    охраняют фамильное имя, будто это собственность. Кассиан, Елена и остальные ученики ещё почти дети. Они играют с силами,
    которых не понимают, пока взрослые делают вид, будто всё под контролем.

    Висп принадлежит семье Торнов и не имеет права распоряжаться собственной
    жизнью. Фамильяры работают без жалованья, спят при кухнях и становятся
    невидимыми, если их хозяевам так удобнее. Приказ заставляет Виспа повиноваться;
    совесть заставляет его помнить, кому именно он причинил боль.

    Лорд Магнус Торн входит в совет попечителей колледжа. Его письма сыну звучат
    как любовь, если читать быстро, и как приказ, если читать внимательно.

    Парализующие связывающие чары обсуждают все. Любой, кто ищет о них сведения,
    выглядит виновным — даже тот, кто пытается защитить других.
  victim:
    name: "Профессор Олдрик Вейн"
    age: "мастер алхимии, глава Железного дома"
    humanization: |
      Самый страшный преподаватель Блэквуда: резкий, беспощадный и блестящий.
      Три дня назад он заметил пропажу ингредиентов из личного хранилища. Вчера
      пропало ещё больше. Он искал вора и нашёл нечто гораздо худшее.

      Его рука вытянута к ученику, которого он пытался защитить. Даже Вейн не
      заслуживал такой участи. Особенно в тот момент, когда решил помочь.
    memorable_trait: "Знал проклятые артефакты лучше всех — поэтому первым понял, насколько опасно происходящее."
    time_of_death: "22:00"
    cause_of_death: "Слоёное связывание: выброс Свечи Вора и связывающие чары фамильяра."
  locations:
    # Evidence text is keyed by canonical IDs; mechanics remain in English case.
    library:
      name: "Запечатанный архив"
      description: |
        Иней расползается по окнам изнутри. Холод здесь не похож на осенний.

        Архив разделён на три ниши высокими стеллажами. Книги глушат звук, и
        каждая ниша кажется отдельной комнатой. Вы стоите в западной. Восточная,
        где у кресла догорела свеча, скрыта за углом примерно в сорока футах.

        Профессор Олдрик Вейн лежит у читального стола. Чёрная мантия собралась
        вокруг ног, правая рука вытянута к кругу оплывших свечей. На лице не гнев,
        а тревога. Фокус наполовину выскользнул из складок одежды — будто он
        начал отвечать на опасность, но не успел.

        В воздухе пахнет белладонной и сухими травами. Под лампой на коже Вейна
        видны два отблеска: холодный голубовато-белый и слабый желтовато-зелёный.
      surface_elements:
        - "Читальный стол с разложенными пергаментами и древним томом, исписанным мелким почерком"
        - "Круг оплывших свечей на полу; место для обряда расчищено"
        - "Сухие травы возле свечей — запах резкий и незнакомый"
        - "Окно в узорах инея, расходящихся от пола"
        - "Тело профессора Вейна: рука тянется к кругу, фокус наполовину вынут, на лице тревога"
        - "Два отблеска на коже Вейна: голубовато-белый и желтовато-зелёный"
        - "Свежие потёртости, ведущие к выходу"
        - "Тёмно-зелёное волокно, зацепившееся за дверную раму"
        - "Дальняя восточная ниша: кресло и догоревшая свеча"
      hidden_evidence:
        hidden_note:
          name: "Смятая записка с извинениями"
          discovery_guidance: "Находится при поиске бумаг и читального стола или после обряда «Открыть скрытое» над столом."
          description: |
            В складках бумаги — детский почерк, торопливый и неровный. Автор
            просит прощения за кражу белладонны: она нужна больному другу. Внизу
            стоит одна буква — «D». Записка старая, примерно трёхдневной давности.
          significance: "Доказывает первую кражу, но не связывает её с нападением на Вейна."
        focus_signature:
          name: "След чар на фокусе профессора Вейна"
          discovery_guidance: "Открывается при магическом чтении фокуса Вейна."
          description: |
            Последние действия фокуса: «Поднять лампу», затем попытка развеять
            чужое заклинание. Ни одного атакующего импульса. Вейн пытался
            остановить происходящее, а не начать бой.
          significance: "Вейн защищался и пытался снять чары; это не похоже на нападение."
        frost_pattern:
          name: "Неестественный узор инея"
          discovery_guidance: "Исследуйте окна, пол и круг свечей; помогает обряд «Опознать вещество»."
          description: |
            Иней растёт против ветра и погоды, расходясь от круга свечей тонкими
            лучами. Внутри кристаллов застряли следы холодной магии. Это не просто
            мороз — помещение пережило резкий выброс силы.
          significance: "Подтверждает магический выброс, но пока не говорит, кто его вызвал."
        dual_shimmer:
          name: "Двойной отблеск на коже профессора Вейна"
          discovery_guidance: "Осмотрите тело Вейна и примените «Опознать вещество» к коже или отблеску."
          description: |
            Под обычным цветом кожи лежат два слоя чар. Первый сияет бледным
            синим и белым, второй — мутным жёлто-зелёным. Они наложились друг
            на друга, словно два разных заклинания сработали почти одновременно.
          significance: "На Вейне следы двух видов магии. Версия об одном заклинании не выдерживает проверки."
        dropped_badge:
          name: "Библиотечный жетон Елены"
          discovery_guidance: "Ищите на полу возле тела Вейна, осмотрите место падения или примените «Открыть скрытое» к архиву."
          description: "Жетон Алого дома найден возле тела. Елена действительно была в архиве, но жетон мог упасть до нападения."
          significance: "Помещает Елену на место происшествия, но сам по себе не доказывает вину."
        scuff_marks:
          name: "Следы на полу"
          discovery_guidance: "Осмотрите пол, ищите следы спешного ухода или осветите потёртости обрядом «Поднять лампу»."
          description: "Свежие потёртости ведут от круга свечей к выходу и лестнице в подземелья. Кто-то уходил быстро."
          significance: "Кто-то покинул архив после выброса магии; направление подходит нескольким людям."
        singed_cloak_fiber:
          name: "Опалённое зелёное волокно"
          discovery_guidance: "Проверьте дверную раму и выход, ищите следы ткани или примените «Открыть скрытое» к двери."
          description: "На дверной раме зацепился дорогой зелёный материал, обожжённый жаром. Такой цвет носят ученики Железного дома, но не только они."
          significance: "Неполный след одежды подозреваемого. Цвет не заменяет лицо и показания."
        ritual_book:
          name: "Открытая книга у читального стола"
          discovery_guidance: "Осмотрите читальный стол и раскрытую книгу; обряд «Открыть скрытое» поможет навести резкость."
          description: "Книга раскрыта на описании тёмного обряда. На полях пометки ученика, рядом застыл воск от свечей."
          significance: "Кто-то заранее готовил ритуал в архиве."
        elena_book_slip:
          name: "Читательский лист и книга"
          discovery_guidance: "Исследуйте восточную нишу, кресло и место для чтения — там Елена прятала следы своего присутствия."
          description: "Запись показывает, что Елена пришла в восточную нишу до нападения и читала о связывающих чарах."
          significance: "Елена была в архиве заранее. Это усиливает подозрения, но не доказывает, что она тронула Вейна."
        hawthorne_confiscation_log:
          name: "Записи мисс Хоторн о конфискациях"
          discovery_guidance: "Ищите записи на столе библиотекаря, просмотрите журналы или осмотрите её рабочее место."
          description: "В библиотечном журнале перечислены изъятые книги и недавний всплеск интереса к парализующим чарам."
          significance: "Такие исследования ведут многие ученики; Елена не единственная, кто мог искать эту тему."
        damaged_ward_stone:
          name: "Треснувший камень защиты"
          discovery_guidance: "Внимательно осмотрите вход в архив и примените «Опознать вещество» к дверной раме."
          description: "В дверной раме почти незаметны трещины. Защита архива слабеет уже несколько недель и больше не фиксирует каждый вход."
          significance: "Любой из подозреваемых мог колдовать внутри, не подняв тревогу."
      not_present:
        - response: "Стены сложены из цельного камня. Тайных проходов здесь нет — только стеллажи и книги."
        - response: "Какой бы артефакт здесь ни использовали, его забрали с собой. Тот, кто убежал, не оставил его в архиве."
    iron_lodge_common_room:
      name: "Гостиная Железного дома"
      description: |
        Заклинание допуска профессора Уитмор покалывает запястье. Каменная стена
        расходится, впуская вас в гостиную Железного дома — одного из старых
        ученических домов Блэквуда. Вам здесь не рады.

        За окнами клубится тёмная вода. Зелёный свет ложится на кожаные кресла
        у почти погасшего камина. В углу Кассиана стоит дорогой сундук с серебряными
        инициалами. Оттуда тянет травами.
      surface_elements:
        - "Окна с зеленоватой водой за стеклом, отбрасывающие тревожный свет"
        - "Кожаные кресла у почти погасшего камина; одно затёрто сильнее остальных"
        - "Письменный стол с обычной перепиской"
        - "Сундук Кассиана — закрыт, на крышке серебряные инициалы «CT»"
        - "Слабый запах трав возле сундука"
        - "Несколько не спящих учеников, холодно следящих за вами"
      hidden_evidence:
        torn_letter:
          name: "Письмо лорда Магнуса Торна"
          discovery_guidance: "Ищите в сундуке Кассиана, примените «Открыть скрытое» или осмотрите его вещи."
          description: "В сундуке Кассиана спрятано письмо на дорогом пергаменте: отец сообщает о посылке с «Свечой Вора», требует ритуал в архиве и велит сыну не разочаровать семью."
          significance: "Связывает Кассиана с проклятым артефактом и подготовкой ритуала."
        stolen_nightshade:
          name: "Украденная белладонна"
          discovery_guidance: "Проверьте сундук Кассиана и прислушайтесь к травяному запаху возле его вещей."
          description: "Под мантиями лежит мешочек с печатью «личные запасы профессора Вейна». Внутри та же белладонна, что рассыпана у свечного круга."
          significance: "Доказывает вторую кражу и связывает Кассиана с ингредиентами ритуала."
        residual_dark_magic:
          name: "След запретного ремесла"
          discovery_guidance: "Примените «Опознать вещество» к сундуку, мантии или другим вещам Кассиана."
          description: "На подкладке сундука и одежде Кассиана осталась холодная сине-белая магия — такой же след оставил иней в архиве."
          significance: "Показывает, что артефакт Кассиана был источником первого магического выброса."
        student_testimony:
          name: "Показания учеников Железного дома"
          discovery_guidance: "Поговорите с учениками Железного дома о том вечере и возвращении Кассиана."
          description: "Одни видели, как Кассиан ушёл с завёрнутым предметом и вернулся бледным; другие уверяют, что он просто нёс книги. Все сходятся только в одном: после возвращения он был напуган."
          significance: "Подтверждает уход и возвращение Кассиана, но время и детали остаются спорными."
        cassian_unsent_letter:
          name: "Неотправленное письмо Кассиана"
          discovery_guidance: "Осмотрите письменный стол Кассиана и его переписку, ищите незаконченный черновик."
          description: "В черновике Кассиан спрашивает отца, действительно ли дед использовал артефакт на войне и не причинил ли кому-нибудь вред. Письмо обрывается посреди фразы."
          significance: "Кассиан боялся артефакта и отцовских ожиданий; это объясняет его поступки, но не снимает вины."
      not_present:
        - response: "Если Свеча Вора и была здесь, её спрятали или выбросили. В сундуке и на виду её нет."
    third_floor_corridor:
      name: "Коридор третьего этажа"
      description: |
        За библиотекой коридор с факелами, потёртыми плитами и портретом,
        который притворяется спящим. Отсюда профессор Уитмор видела двери архива,
        лестницу в подземелья и того, кто уходил после десяти.
      surface_elements:
        - "Мерцающие факелы в настенных держателях"
        - "Окно на залитые луной земли колледжа"
        - "Каменный пол с едва заметными следами патрулей"
        - "Портрет засыпающего ученика у дверей библиотеки"
        - "Прямая видимость на двери библиотеки и лестницу в подземелья"
        - "Потёртости на стене, где Вейн днём загнал Елену в угол"
      hidden_evidence:
        hallway_confrontation:
          name: "Свидетельство о дневной ссоре"
          discovery_guidance: "Спросите о событиях до нападения, расспросите о Елене и Вейне или изучите коридор."
          description: "Днём Вейн публично угрожал Елене исключением за запрещённые уроки. Она ответила, что найдёт способ остановить его."
          significance: "Даёт Елене мотив, но мотив — ещё не доказательство."
        magnus_order:
          name: "Оборванный приказ на пергаменте"
          discovery_guidance: "Проверьте пол у входа в библиотеку, осмотрите коридор или примените «Открыть скрытое»."
          description: "На клочке бумаги узнаваемый почерк Магнуса: приказ защищать Кассиана любой ценой. Кому он адресован, не написано."
          significance: "Связывает Магнуса с тем, кто вмешался после ритуала."
        prefect_patrol_notes:
          name: "Расписание патрулей старост"
          discovery_guidance: "Исследуйте доску объявлений, спросите о маршрутах патрулей или проверьте безопасность коридора."
          description: "В расписании есть окно, когда верхние коридоры и лестница в подземелья оставались без присмотра."
          significance: "Объясняет, как несколько людей прошли к архиву незамеченными."
      not_present:
        - response: "Следов борьбы здесь нет. Всё произошло внутри Запечатанного архива."
    kitchens:
      name: "Кухни Блэквуда"
      description: |
        Под главным залом кипит другой колледж: пар, медные котлы, журналы смен
        и бесконечная работа фамильяров. Здесь пахнет хлебом, лекарственными
        травами и усталостью. В дальнем углу Висп устроил место для больной Пиппы.
      surface_elements:
        - "Медная посуда, свисающая с потолка"
        - "Четыре длинных стола для готовки"
        - "Фамильяры молча работают, не поднимая глаз"
        - "Маленькая койка, где Пиппа отдыхает под лоскутным одеялом"
        - "Висп сидит рядом с подругой, уши опущены"
        - "Руки Виспа обмотаны тканевыми бинтами"
        - "Журнал кухни висит у двери"
        - "Уголок Виспа: аккуратнее остальных, на виду сушатся разные носки"
      hidden_evidence:
        healing_supplies:
          name: "Лекарственные припасы Виспа"
          discovery_guidance: "Осмотрите место Виспа, койку Пиппы и кухонный угол; можно применить «Открыть скрытое»."
          description: "В кухонном углу аккуратно сложены бинты и простые лекарства для Пиппы. Среди них — следы украденной белладонны."
          significance: "Подтверждает первую кражу Виспа и его попытку помочь больной подруге."
        kitchen_log:
          name: "Журнал кухонной смены"
          discovery_guidance: "Проверьте журнал у двери, спросите, где был Висп, или примените «Открыть скрытое» к записи."
          description: "Запись показывает, что Висп отсутствовал на кухне одиннадцать минут — ровно во время нападения."
          significance: "Разрушает его алиби и помещает его рядом с местом событий."
        wisp_frostbite:
