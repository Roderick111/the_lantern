      aftermath: |
        Виспа передали под надзор Министерства, пока Оккультная коллегия впервые
        всерьёз обсуждала вопрос: можно ли судить фамильяра за поступок, совершённый
        под магическим принуждением?

        Дело стало прецедентом. Елена Марш, которую молчание Виспа едва не сделало
