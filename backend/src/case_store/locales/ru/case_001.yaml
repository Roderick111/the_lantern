case:
  id: "case_001"
  title: "Опечатанная библиотека"
  description: |
    Профессор Аркадий Вежин застыл в опечатанной библиотеке. Сцена связывает троих
    подозреваемых с двумя кражами. После обряда на профессоре остался след, за который
    никто не хочет отвечать. Простая версия сразу указывает на одного человека.
    Улики говорят о другом.
  setting: "Чернолесская коллегия, осень 1890 года"
  crime_scene: "Опечатанная библиотека"
  hook: |
    Профессор застыл с вытянутой рукой, словно пытался остановить кого-то. Елена
    поссорилась с ним. Касьян принёс в коллегию проклятый артефакт. Приписной домовой
    хотел помочь своему молодому хозяину. У каждого своя тайна. Они ведут к разным
    поступкам.
  twist: "Обряд Касьяна оглушил профессора и оставил его в сознании. Тихон исполнял приказ Мстислава и наложил на Вежина связывающие чары домового. Второе заклинание закрепило действие первого. Свеча Вора объясняет начало случившегося."
  world_context: |
    Вы расследуете дело Тайного приказа. Орден Светоча ведёт дела, до которых
    обычная полиция не добирается. Свидетелей держат в школе, библиотека заперта,
    а руководство коллегии мечтает о тихом исходе.

    Чернолесская коллегия живёт слухами. Три ночи назад кто-то повредил защиту
    восточной ниши библиотеки. В прошлом месяце на парапете нашли окоченевшего
    ворона смотрителя. На стенах появились надписи о борьбе за наследство
    Железного двора. Ученики из семей без дара боятся лишний раз поднять глаза.

    Железный двор держится за фамильное имя так, будто им можно владеть. Ученики здесь
    ещё почти дети и играют с силами, которых не понимают. Взрослые делают вид, что
    всё под контролем.

    Тихон принадлежит семье Тернских и не имеет права распоряжаться собственной
    жизнью. Приписные домовые работают без жалованья и спят при кухнях. Хозяева
    замечают их, когда им что-то нужно. Тихон помнит, кому причинил боль, даже когда
    приказ не оставляет ему выбора.

    Старший господин Мстислав Тернский входит в совет попечителей коллегии. В письмах
    сыну он говорит о любви к семье и требует доказательств преданности.

    По коллегии ходят слухи о парализующих чарах. Любой вопрос об этом обряде звучит
    как признание. Люди ищут способ защитить других и всё равно вызывают подозрения.
  victim:
    name: "Профессор Аркадий Вежин"
    age: "мастер алхимии, глава Железного двора"
    humanization: |
      Самый страшный преподаватель Чернолесья, резкий и блестящий.
      Три дня назад он заметил пропажу ингредиентов из личного хранилища. Вчера
      пропало ещё больше. Он искал вора и наткнулся на опасный чужой замысел.

      Его рука вытянута к ученику, которого он пытался защитить. В тот вечер Вежин
      понял, что обряд вышел из-под контроля, и пошёл его остановить.
    memorable_trait: "Знал проклятые артефакты лучше всех и первым понял, насколько опасен этот обряд."
    time_of_death: "22:00"
    cause_of_death: "Слоёное связывание: выброс Свечи Вора и связывающие чары домового."
  locations:
    # Evidence text is keyed by canonical IDs; mechanics remain in English case.
    library:
      name: "Опечатанная библиотека"
      description: |
        Иней выступил на стёклах изнутри. Холод въелся в камень, и осенью так не бывает.

        Библиотечные залы разделены на три ниши высокими стеллажами. Книги глушат звук, и каждая ниша кажется отдельной комнатой. Вы стоите в западной. Восточная, где у кресла догорела свеча, скрыта за углом примерно в сорока футах.

        Профессор Аркадий Вежин лежит у читального стола. Чёрная мантия собралась вокруг ног, правая рука вытянута к кругу оплывших свечей. Лицо напряжено. Фокус наполовину выскользнул из складок одежды. Вежин потянулся к нему, когда понял, что обряд выходит из-под контроля.

        В воздухе пахнет белладонной и сухими травами. Под лампой на коже Вежина видны два отблеска: холодный голубовато-белый и слабый желтовато-зелёный.
      surface_elements:
        - "Читальный стол с разложенными пергаментами и древним томом, исписанным мелким почерком"
        - "Круг оплывших свечей на полу; место для обряда расчищено"
        - "Сухие травы возле свечей, запах резкий и незнакомый"
        - "Окно в узорах инея, расходящихся от пола"
        - "Тело профессора Вежина: рука тянется к кругу, фокус наполовину вынут, на лице тревога"
        - "Два отблеска на коже Вежина: голубовато-белый и желтовато-зелёный"
        - "Свежие потёртости, ведущие к выходу"
        - "Тёмно-зелёное волокно, зацепившееся за дверную раму"
        - "Дальняя восточная ниша: кресло и догоревшая свеча"
      hidden_evidence:
        hidden_note:
          name: "Смятая записка с извинениями"
          discovery_guidance: "Находится при поиске бумаг и читального стола или после обряда «Открыть скрытое» над столом."
          description: |
            В складках бумаги, детский почерк, торопливый и неровный. Автор
            просит прощения за кражу белладонны: она нужна больному другу. Внизу
            стоит одна буква, «D». Записка старая, примерно трёхдневной давности.
          significance: "Доказывает первую кражу, но не связывает её с нападением на Вежина."
        focus_signature:
          name: "След чар на фокусе профессора Вежина"
          discovery_guidance: "Открывается при магическом чтении фокуса Вежина."
          description: |
            Последние действия фокуса: «Поднять лампу», затем попытка развеять
            чужое заклинание. Ни одного атакующего импульса. Вежин пытался
            остановить происходящее, а не начать бой.
          significance: "Вежин защищался и пытался снять чары; это не похоже на нападение."
        frost_pattern:
          name: "Неестественный узор инея"
          discovery_guidance: "Исследуйте окна, пол и круг свечей; помогает обряд «Опознать вещество»."
          description: |
            Иней расходится от круга свечей тонкими лучами. В кристаллах остались
            следы холодной магии. Помещение пережило резкий выброс силы.
          significance: "Подтверждает магический выброс, но пока не говорит, кто его вызвал."
        dual_shimmer:
          name: "Двойной отблеск на коже профессора Вежина"
          discovery_guidance: "Осмотрите тело Вежина и примените «Опознать вещество» к коже или отблеску."
          description: |
            Под обычным цветом кожи лежат два слоя чар. Первый сияет бледным
            синим и белым, второй, мутным жёлто-зелёным. Они наложились друг
            на друга, словно два разных заклинания сработали почти одновременно.
          significance: "На Вежине остались следы двух видов магии. Одного заклинания для этого недостаточно."
        dropped_badge:
          name: "Библиотечный жетон Елены"
          discovery_guidance: "Ищите на полу возле тела Вежина, осмотрите место падения или примените «Открыть скрытое» к библиотеке."
          description: "Жетон Алого двора найден возле тела. Елена была в библиотеке, а жетон мог упасть до нападения."
          significance: "Помещает Елену на место происшествия, но сам по себе не доказывает вину."
        scuff_marks:
          name: "Следы на полу"
          discovery_guidance: "Осмотрите пол, ищите следы спешного ухода или осветите потёртости обрядом «Поднять лампу»."
          description: "Свежие потёртости ведут от круга свечей к выходу и лестнице в подземелья. Кто-то уходил быстро."
          significance: "Кто-то покинул библиотеку после выброса магии; направление подходит нескольким людям."
        singed_cloak_fiber:
          name: "Опалённое зелёное волокно"
          discovery_guidance: "Проверьте дверную раму и выход, ищите следы ткани или примените «Открыть скрытое» к двери."
          description: "На дверной раме зацепился обожжённый кусок дорогой зелёной ткани. Такой цвет носят ученики Железного двора."
          significance: "Неполный след одежды подозреваемого. Цвет не заменяет лицо и показания."
        ritual_book:
          name: "Открытая книга у читального стола"
          discovery_guidance: "Осмотрите читальный стол и раскрытую книгу; обряд «Открыть скрытое» поможет навести резкость."
          description: "Книга раскрыта на описании тёмного обряда. На полях пометки ученика, рядом застыл воск от свечей."
          significance: "Кто-то заранее готовил обряд в библиотеке."
        elena_book_slip:
          name: "Читательский лист и книга"
          discovery_guidance: "Исследуйте восточную нишу, кресло и место для чтения, там Елена прятала следы своего присутствия."
          description: "Запись показывает, что Елена пришла в восточную нишу до нападения и читала о связывающих чарах."
          significance: "Елена пришла в библиотеку заранее. Запись усиливает подозрения, сама по себе она не доказывает нападение."
        hawthorne_confiscation_log:
          name: "Записи библиотекарши Боярышниковой о конфискациях"
          discovery_guidance: "Ищите записи на столе библиотекаря, просмотрите журналы или осмотрите её рабочее место."
          description: "В библиотечном журнале перечислены изъятые книги и недавний всплеск интереса к парализующим чарам."
          significance: "Парализующие чары изучали и другие ученики. Одна эта запись не указывает на Елену."
        damaged_ward_stone:
          name: "Треснувший камень защиты"
          discovery_guidance: "Внимательно осмотрите вход в библиотеку и примените «Опознать вещество» к дверной раме."
          description: "В дверной раме почти незаметны трещины. Защита библиотеки слабеет уже несколько недель и больше не фиксирует каждый вход."
          significance: "Любой из подозреваемых мог колдовать внутри, не подняв тревогу."
      not_present:
        - response: "Стены сложены из цельного камня. Тайных проходов здесь нет, только стеллажи и книги."
        - response: "Какой бы артефакт здесь ни использовали, его забрали с собой. Тот, кто убежал, не оставил его в библиотеке."
    iron_lodge_common_room:
      name: "Гостиная Железного двора"
      description: |
        Заклинание допуска профессора Витязева покалывает запястье. Каменная стена расходится, впуская вас в гостиную Железного двора, одного из старых ученических домов Чернолесья. Вам здесь не рады.

        За окнами клубится тёмная вода. Зелёный свет ложится на кожаные кресла у почти погасшего камина. В углу Касьяна стоит дорогой сундук с серебряными инициалами. Оттуда тянет травами.
      surface_elements:
        - "Окна с зеленоватой водой за стеклом, отбрасывающие тревожный свет"
        - "Кожаные кресла у почти погасшего камина; одно затёрто сильнее остальных"
        - "Письменный стол с обычной перепиской"
        - "Сундук Касьяна, закрыт, на крышке серебряные инициалы «CT»"
        - "Слабый запах трав возле сундука"
        - "Несколько не спящих учеников, холодно следящих за вами"
      hidden_evidence:
        torn_letter:
          name: "Письмо лорда Мстислава Тернского"
          discovery_guidance: "Ищите в сундуке Касьяна, примените «Открыть скрытое» или осмотрите его вещи."
          description: "В сундуке Касьяна спрятано письмо на дорогом пергаменте: отец сообщает о посылке с «Свечой Вора», требует обряд в библиотеке и велит сыну не разочаровать семью."
          significance: "Связывает Касьяна с проклятым артефактом и подготовкой обряда."
        stolen_nightshade:
          name: "Украденная белладонна"
          discovery_guidance: "Проверьте сундук Касьяна и прислушайтесь к травяному запаху возле его вещей."
          description: "Под мантиями лежит мешочек с печатью «личные запасы профессора Вежина». Внутри та же белладонна, что рассыпана у свечного круга."
          significance: "Доказывает вторую кражу и связывает Касьяна с ингредиентами обряда."
        residual_dark_magic:
          name: "След запретного ремесла"
          discovery_guidance: "Примените «Опознать вещество» к сундуку, мантии или другим вещам Касьяна."
          description: "На подкладке сундука и одежде Касьяна осталась холодная сине-белая магия, такой же след оставил иней в библиотеке."
          significance: "Показывает, что артефакт Касьяна был источником первого магического выброса."
        student_testimony:
          name: "Показания учеников Железного двора"
          discovery_guidance: "Поговорите с учениками Железного двора о том вечере и возвращении Касьяна."
          description: "Одни видели, как Касьян ушёл с завёрнутым предметом и вернулся бледным. Другие уверяют, что он просто нёс книги. Все отмечают одно: после возвращения он был напуган."
          significance: "Подтверждает уход и возвращение Касьяна, но время и детали остаются спорными."
        cassian_unsent_letter:
          name: "Неотправленное письмо Касьяна"
          discovery_guidance: "Осмотрите письменный стол Касьяна и его переписку, ищите незаконченный черновик."
          description: "В черновике Касьян спрашивает отца, действительно ли дед использовал артефакт на войне и не причинил ли кому-нибудь вред. Письмо обрывается посреди фразы."
          significance: "Касьян боялся артефакта и отцовских ожиданий; это объясняет его поступки, но не снимает вины."
      not_present:
        - response: "Если Свеча Вора и была здесь, её спрятали или выбросили. В сундуке и на виду её нет."
    third_floor_corridor:
      name: "Коридор третьего этажа"
      description: |
        За библиотекой коридор с факелами, потёртыми плитами и портретом, который притворяется спящим. Отсюда профессор Витязева видела двери библиотеки, лестницу в подземелья и того, кто уходил после десяти.
      surface_elements:
        - "Мерцающие факелы в настенных держателях"
        - "Окно на залитые луной земли коллегии"
        - "Каменный пол с едва заметными следами патрулей"
        - "Портрет засыпающего ученика у дверей библиотеки"
        - "Прямая видимость на двери библиотеки и лестницу в подземелья"
        - "Потёртости на стене, где Вежин днём загнал Елену в угол"
      hidden_evidence:
        hallway_confrontation:
          name: "Свидетельство о дневной ссоре"
          discovery_guidance: "Спросите о событиях до нападения, расспросите о Елене и Вежине или изучите коридор."
          description: "Днём Вежин публично угрожал Елене исключением за запрещённые уроки. Она ответила, что найдёт способ остановить его."
          significance: "Даёт Елене мотив, но мотив, ещё не доказательство."
        magnus_order:
          name: "Оборванный приказ на пергаменте"
          discovery_guidance: "Проверьте пол у входа в библиотеку, осмотрите коридор или примените «Открыть скрытое»."
          description: "На клочке бумаги узнаваемый почерк Мстислава: приказ защищать Касьяна любой ценой. Кому он адресован, не написано."
          significance: "Связывает Мстислава с тем, кто вмешался после обряда."
        prefect_patrol_notes:
          name: "Расписание патрулей старост"
          discovery_guidance: "Исследуйте доску объявлений, спросите о маршрутах патрулей или проверьте безопасность коридора."
          description: "В расписании есть окно, когда верхние коридоры и лестница в подземелья оставались без присмотра."
          significance: "Объясняет, как несколько людей прошли к библиотеке незамеченными."
      not_present:
        - response: "Следов борьбы здесь нет. Всё произошло внутри опечатанной библиотеки."
    kitchens:
      name: "Кухни Чернолесья"
      description: |
        Под главным залом кипит другая жизнь: пар над котлами и бесконечная работа домовых. Здесь пахнет хлебом, лекарственными травами и усталостью. В дальнем углу Тихон устроил место для больной Запечницы Марьюшки.
      surface_elements:
        - "Медная посуда, свисающая с потолка"
        - "Четыре длинных стола для готовки"
        - "Приписные домовые молча работают, не поднимая глаз"
        - "Маленькая койка, где Запечница Марьюшка отдыхает под лоскутным одеялом"
        - "Тихон сидит рядом с подругой, уши опущены"
        - "Руки Тихона обмотаны тканевыми бинтами"
        - "Журнал кухни висит у двери"
        - "Уголок Тихона: аккуратнее остальных, на виду сушатся разные носки"
      hidden_evidence:
        healing_supplies:
          name: "Лекарственные припасы Тихона"
          discovery_guidance: "Осмотрите место Тихона, койку Марьюшки и кухонный угол; можно применить «Открыть скрытое»."
          description: "В кухонном углу аккуратно сложены бинты и простые лекарства для Марьюшки. Среди них, следы украденной белладонны."
          significance: "Подтверждает первую кражу Тихона и его попытку помочь больной подруге."
        kitchen_log:
          name: "Журнал кухонной смены"
          discovery_guidance: "Проверьте журнал у двери, спросите, где был Тихон, или примените «Открыть скрытое» к записи."
          description: "Запись показывает, что Тихон отсутствовал на кухне одиннадцать минут, ровно во время нападения."
          significance: "Разрушает его алиби и помещает его рядом с местом событий."
        wisp_frostbite:
          name: "Обмороженные руки Тихона"
          discovery_guidance: "Осмотрите перебинтованные руки Тихона, примените «Опознать вещество» или спросите о бинтах."
