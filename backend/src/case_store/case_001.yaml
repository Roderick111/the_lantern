  # ---------------------------------------------------------------------------
  # SOLUTION
  # ---------------------------------------------------------------------------
  solution:
    culprit: "wisp"
    method: "Wisp applied bound familiar binding magic after the Thief's Candle discharge. Cassian's ritual stunned Professor Vane. Wisp's spell completed the paralytic binding."
    motive: "Lord Magnus Thorne ordered Wisp to protect Cassian at all costs. Wisp obeyed when Professor Vane tried to stop the ritual. He meant to hold the professor briefly. The two spells combined into permanent paralysis."

    key_evidence:
      - "dual_shimmer" # Two magic types on Professor Vane, proves two attackers
      - "kitchen_log" # Wisp absent during exact attack window
      - "wisp_frostbite" # Physical proof Wisp was at the scene
      - "magnus_order" # Proves Wisp was acting under orders
      - "focus_signature" # Shows Professor Vane was casting a protective Dispel
      - "frost_pattern" # Thief's Candle discharge (Cassian's contribution)
      - "torn_letter" # Connects Thief's Candle to Cassian
      - "elena_book_slip" # Clears Elena (she was reading in the alcove)

    deductions_required:
      - "Two magic types on Professor Vane point to separate magical events"
      - "Cassian's confession: Professor Vane was still moving when he fled, something finished the job"
      - "Kitchen log: Wisp was absent during the exact attack window"
      - "Wisp's frostbite: physical proof he was at the scene during both magical events"
      - "Magnus's parchment: orders to protect Cassian, Wisp was following master's commands"
      - "Bound familiar binding magic matches the second shimmer on Professor Vane"
      - "Elena's timeline and alcove position clear her"
      - "Cassian committed reckless forbidden craft. Wisp completed the paralytic binding"
      - "Wisp is enslaved, raising the question of responsibility"

    correct_reasoning_requires:
      - "Question the assumption that one magical event caused the paralysis"
      - "Read the dual signature as evidence of separate magical acts"
      - "Use the timeline gap (10:02-10:05) to identify the second actor"
      - "Connect Wisp's physical evidence (frostbite, absence) to the crime"
      - "Recognize that bound familiar magic can bind an initiate"
      - "Recognize that slavery drove Wisp's decision"

    common_mistakes:
      - error: "Accuse Elena"
        reason: "Strong motive, present at scene before attack, practiced paralytic binding magic that day"
        why_wrong: "She was in the eastern alcove, forty feet away. The candle burn time places her there during the attack. Her spell signatures do not match either effect on Professor Vane."

      - error: "Accuse Cassian"
        reason: "Performed the ritual, fled the scene, has the artifact, overwhelming physical evidence"
        why_wrong: "Cassian's own confession says Professor Vane was still moving when he fled. The Thief's Candle stunned him. The dual shimmer points to a second spell, and that spell completed the paralysis. Cassian is guilty of reckless forbidden craft, while the full binding belongs to Wisp."

      - error: "Rule it an accident"
        reason: "Cassian didn't intend harm, artifact malfunctioned"
        why_wrong: "Two separate magical acts occurred. The Thief's Candle discharge may have been accidental. The binding magic was deliberate, and someone chose to freeze Professor Vane."

    fallacies_to_catch:
      - fallacy: "confirmation_bias"
        example: "Locking onto Elena because she had motive, ignoring timeline and magical evidence"

      - fallacy: "appeal_to_authority"
        example: "Trusting Professor Whitmore's 'cursed artifact discharge' interpretation without questioning the second shimmer"

      - fallacy: "anchoring_bias"
        example: "The evidence avalanche against Cassian makes it hard to consider alternatives even when his confession contradicts his guilt"

      - fallacy: "capability_dismissal"
        example: "Dismissing Wisp because bound familiar magic seems incapable of this spell"

