# ============================================================================
# CASE 001: The Sealed Archive (Full Redesign v3)
# ============================================================================
# Mystery structure:
# - Three-phase suspicion: Elena (early) -> Cassian (mid) -> Wisp (truth)
# - Tragic twist: Wisp is still a slave. Magnus ordered him to protect Cassian.
#   He used bound familiar binding magic on Professor Vane when Professor Vane tried to stop Cassian's
#   ritual. The Thief's Candle discharge + bound familiar binding = full paralytic binding.
# - Evidence is RAW DATA — no self-interpreting descriptions
# - Each witness interprets evidence differently
# - Cassian genuinely believes he did it (doesn't know Wisp was there)
#
# REVELATION PACING GUIDE:
# -------------------------
# EARLY (Elena looks guilty):
#   - dropped_badge (places Elena at scene)
#   - hallway_confrontation (Elena's motive)
#   - elena_book_slip (she was ALREADY there before the attack)
#   - elena_focus_check (paralytic binding magic that day)
#
# MID (Cassian looks guilty — evidence avalanche):
#   - frost_pattern (forbidden craft discharge — but raw, no conclusion)
#   - ritual_book (someone was performing dark ritual)
#   - singed_cloak_fiber (expensive green fabric)
#   - torn_letter (Magnus → Cassian about Thief's Candle)
#   - stolen_nightshade (in Cassian's trunk)
#   - student_testimony (Cassian left/returned terrified)
#
# LATE (something doesn't fit):
#   - focus_signature (Professor Vane was helping, not attacking)
#   - dual_shimmer (TWO magic types on Professor Vane — the crack)
#   - cassian_confession (Professor Vane was still moving when he fled)
#   - kitchen_log (Wisp absent 11 minutes during attack)
#   - magnus_order (parchment ordering Wisp to protect Cassian)
#   - wisp_frostbite (physical evidence on Wisp's hands)
#
# CONFIRMATION:
#   - Timeline gap: Cassian fled 10:02, Elena found Professor Vane 10:05
#   - Dual shimmer = scholar's artifact + bound familiar magic
#   - Wisp's disproportionate guilt/self-punishment
#   - Magnus's order + kitchen log + frostbite = airtight
# ============================================================================

case:
  id: "case_001"
  title: "The Sealed Archive"
  difficulty: beginner
  description: "Professor Aldric Vane lies frozen in Blackwood's sealed archive. Three suspects, two thefts, and a spell no one will claim. The first answer looks obvious. That is why it cannot be trusted."

  crime_type: "assault"
  setting: "Blackwood Collegiate, autumn 1890"
  crime_scene: "the Sealed Archive"
  hook: "A professor frozen with one hand outstretched. A student with a motive. Another with a dangerous relic. And a bound familiar who only meant to help. Everyone is guilty of something; only one act became this crime."
  twist: "Cassian's ritual stunned Professor Vane but didn't finish the job. Wisp — still enslaved, following Magnus's orders — used bound familiar binding magic to freeze Professor Vane completely. The two magics layered together. Everyone assumes it was the Thief's Candle alone."

  # ---------------------------------------------------------------------------
  # WORLD CONTEXT (injected into narrator prompt for atmospheric grounding)
  # ---------------------------------------------------------------------------
  world_context: |
    The Crown Bureau of Supernatural Investigations has sent an investigator from the Lantern Order — its field order for cases ordinary constables cannot touch — to Blackwood Collegiate. Witnesses are being held, the archive is under guard, and the college authorities want the matter buried before breakfast.

    London in 1890 is mad for spiritualism: slate-writing, phosphor ghosts, hidden wires — parlour fraud everywhere. What happened here involved genuine warded craft, not stage tricks. Bureau men speak in cautions and forms; collegians and bound familiars live under sharper class lines than either side admits.

    It is autumn term at Blackwood Collegiate. Three nights ago someone damaged the ward on the archive's eastern alcove. Last month the custodian's raven was found stiff on the parapet. Someone has painted threats about the Iron Lodge succession on the walls. Iron Lodge is one of the college's old student houses, and its heirs guard the name like property. Students born without the old families' gift keep their heads down. The college is tense, divided, and waiting for the next door to lock.

    Cassian, Elena, and the other students are sixteen or seventeen — young initiates dealing with forces beyond their understanding.

    Wisp is still enslaved by the Thorne family and has no legal rights. Bound familiars at Blackwood Collegiate work without pay, sleep beside the kitchens, and disappear from notice whenever that is convenient. Wisp's conscience keeps colliding with the magic that compels obedience.

    Lord Magnus Thorne sits on the Blackwood Collegiate Board of Governors. His influence reaches every corridor. His letters to Cassian mix affection with pressure to uphold the family legacy. Cassian is desperate to prove he deserves the name.

    The school atmosphere is one of whispered rumors, sidelong glances, and locked doors. Paralytic binding is on everyone's mind. Anyone researching it — for any reason — looks suspicious.

  # ---------------------------------------------------------------------------
  # VICTIM
  # ---------------------------------------------------------------------------
  victim:
    name: "Professor Aldric Vane"
    age: "Alchemy Master, head of the Iron Lodge house"
    humanization: |
      The most feared professor at Blackwood Collegiate — harsh, unforgiving, brilliant.
      Three days ago, he found ingredients missing from his private stores. Yesterday,
      more vanished. He was hunting a thief when he found something worse.
      His arm is outstretched, reaching toward a student he was trying to protect.
      Even Professor Vane didn't deserve this. Especially not for trying to help.
    memorable_trait: "Knew cursed artifacts better than anyone — which is why he recognized the danger"
    time_of_death: "10:00 PM"
    cause_of_death: "Layered paralytic binding: Thief's Candle discharge + bound familiar binding magic"

  # ---------------------------------------------------------------------------
  # LOCATIONS
  # ---------------------------------------------------------------------------
  locations:
    # =========================================================================
    # Location 1: Library - Sealed Archive (Crime Scene)
    # =========================================================================
    library:
      id: "library"
      name: "Sealed Archive"
      type: "micro"

      description: |
        Frost on the windows. Unnatural cold.

        The archive is divided into three alcoves by towering shelves. Ancient
        tomes swallow every sound. You stand in the western alcove. The eastern
        alcove, where a reading chair sits beside a burned-down candle, is forty
        feet away and hidden around a corner.

        Professor Aldric Vane lies motionless beside the reading desk. Black robes
        pool around him. His right arm reaches towards a circle of melted candles.
        His face holds no anger, only concern. His focus is half-drawn from his robes,
        as if he began to answer a danger and never finished.

        The smell of nightshade. Scattered herbs. The air feels wrong — heavy,
        charged, cold in a way that has nothing to do with the season.

        Under lamplight, Professor Vane's skin has an odd shimmer — a pale blue-white
        sheen overlaid with something else, a faint yellowish-green tinge that
        catches the light at certain angles.

      surface_elements:
        - "Reading desk with scattered parchments and an ancient tome open to cramped handwriting"
        - "Circle of melted candles on the floor, ritual space cleared"
        - "Scattered dried herbs near the candle circle — pungent, unfamiliar smell"
        - "Frost-covered window with unnatural patterns radiating from floor"
        - "Professor Vane's body — arm reaching toward the ritual circle, focus partially drawn, expression of concern"
        - "Odd dual-tone shimmer on Professor Vane's skin: blue-white and yellowish-green"
        - "Faint scuff marks leading toward the exit"
        - "A dark green fiber caught on the doorframe"
        - "Eastern alcove visible in the distance — reading chair, burned-down candle"

      witnesses_present: ["elena"]

      spell_contexts:
        available_spells:
          - "unveil"
          - "sense_presence"
          - "identify_substance"
          - "raise_the_lamp"
          - "echo_reading"
        special_interactions:
          unveil:
            targets:
              - "desk"
              - "floor"
              - "papers"
              - "ritual circle"
              - "doorframe"
            reveals_evidence:
              - "dropped_badge"
              - "hidden_note"
              - "ritual_book"
              - "singed_cloak_fiber"
          echo_reading:
            targets:
              - "vane's focus"
              - "focus"
              - "victim's focus"
            reveals_evidence:
              - "focus_signature"
          identify_substance:
            targets:
              - "frost"
              - "window"
              - "floor"
              - "ritual circle"
              - "vane"
              - "body"
              - "shimmer"
              - "skin"
            reveals_evidence:
              - "frost_pattern"
              - "dual_shimmer"
          raise_the_lamp:
            targets:
              - "floor"
              - "exit"
              - "scuff marks"
              - "footprints"
              - "doorframe"
            reveals_evidence:
              - "scuff_marks"
              - "singed_cloak_fiber"

      hidden_evidence:
        # Wisp's apology note - initial ambiguity
        - id: "hidden_note"
          name: "Crumpled Apology Note"
          location_found: "library"
          type: "documentary"
          discovery_guidance: "Revealed when player searches the reading desk, examines papers, or uses Unveil on the desk area."
          description: |
            A small, crumpled note written in shaky, childlike handwriting:

            "Master Professor, D. is sorry. D. needed nightshade for sick friend.
            D. will return it. Please don't tell. — D."

            The date is from three days ago. The handwriting is crude, almost
            desperate. The letter "D." could refer to several people.
          tag: "[EVIDENCE: hidden_note]"
          significance: "Connects to an ingredient theft but not necessarily the attack. The 'D.' is ambiguous."
          strength: 40
          points_to: ["wisp", "cassian"]
          witness_reactions:
            elena: "That handwriting is too crude for a student. Bound familiars write like that — I've seen their kitchen logs."
            cassian: "Probably that bound familiar. They steal constantly. Nothing to do with me."
            whitmore: "This matches the first theft report. But there was a second theft yesterday — this note doesn't explain that one."
            wisp: "*ears flatten* Wisp... Wisp wrote that note. Wisp is sorry! But Wisp only took the nightshade ONCE!"

        # Professor Vane's focus - proves he was trying to help
        - id: "focus_signature"
          name: "Professor Vane's Focus Signature"
          location_found: "library"
          type: "magical"
          discovery_guidance: "Revealed when player casts Echo Reading on Professor Vane's focus or examines the focus magically."
          description: |
            Echo Reading reveals Professor Vane's focus activity:

            Last spell: "Dispel" (attempted cancellation)
            Before that: "Raise the Lamp" (1 hour prior)

            No offensive spells. No defensive spells. His last act was an
            attempted cancellation of something.
          tag: "[EVIDENCE: focus_signature]"
          significance: "Professor Vane was trying to cancel something, not attack or defend. Why?"
          strength: 85
          points_to: []
          witness_reactions:
            elena: "Dispel? That's a cancellation spell. He was trying to STOP something, not fight someone."
            cassian: "*goes very still* He... he was trying to stop it? Not... not punish me?"
            whitmore: "Dispel. Aldric was attempting to safely shut down an active magical process. He walked into danger willingly."
            wisp: "*very quietly* The professor was trying to help... Wisp knows this."

        # Frost pattern - raw, no interpretation
        - id: "frost_pattern"
          name: "Unusual Frost Pattern"
          location_found: "library"
          type: "magical"
          discovery_guidance: "Revealed when player examines the frost patterns, window, or floor near the ritual circle. Identify Substance confirms magical origin."
          description: |
            Irregular crystalline frost covers a six-foot radius on the stone
            floor. The center point has a slight scorch mark beneath the frost.
            The temperature in this area is noticeably colder than the rest
            of the room.

            Identify Substance confirms magical origin — but the signature is
            complex. The frost radiates outward in a starburst pattern from
            the center. Something powerful discharged here.
          tag: "[EVIDENCE: frost_pattern]"
          significance: "Magical discharge at the ritual site. The source and nature are unclear."
          strength: 70
          points_to: []
          witness_reactions:
            elena: "The center scorch is unusual. Freezing cantrips don't leave burns. This looks like combustion followed by rapid cold expansion — I've read about that in cursed artifact theory."
            cassian: "*changes subject quickly* Probably a malfunctioning ward. Old library, old magic."
            whitmore: "Cursed artifact discharge. Several cursed objects produce frost like this — Thief's Candle, Cursed Opal, Winter's Grip amulet. I can't identify which from the pattern alone."
            wisp: "Wisp does not know about frost. Wisp was not there. *does not look at the evidence*"

        # THE KEY NEW EVIDENCE: dual shimmer on Professor Vane
        - id: "dual_shimmer"
          name: "Dual-Tone Shimmer on Professor Vane"
          location_found: "library"
          type: "magical"
          discovery_guidance: "Revealed when player examines Professor Vane closely, casts Identify Substance on the body, or specifically investigates the unusual skin discoloration."
          description: |
            Identify Substance on Professor Vane reveals two distinct magical layers:

            Layer 1: A pale blue-white residue, cold to the touch. Concentrated
            around Professor Vane's torso and arms. Consistent with the frost on the floor.

            Layer 2: A faint yellowish-green shimmer, warmer, covering Professor Vane's
            entire body more evenly. This second layer sits ON TOP of the first,
            as if applied moments after.

            Two separate magical effects. Two different signatures. Applied in
            sequence, not simultaneously.
          tag: "[EVIDENCE: dual_shimmer]"
          significance: "Two layers of magic on Professor Vane. This is the key evidence that breaks the single-culprit theory."
          strength: 95
          points_to: []
          witness_reactions:
            elena: "Two layers? That's... the blue-white is consistent with cursed artifact discharge. But the yellowish-green — I've read about that color. *hesitates* I need to check something. It might be... no. It can't be."
            cassian: "*genuinely confused* Two colors? I don't... I only used the one artifact. What's the second one?"
            whitmore: "The blue-white is artifact residue, certainly. The other color... *long pause* I've seen that tinge once before. In bound familiar containment magic. But that would mean... no. That's impossible."
            wisp: "*tries to leave the conversation* Wisp does not understand initiate magic. The professors would know better than Wisp."

        # Elena's badge - places her at scene
        - id: "dropped_badge"
          name: "Elena's Library Badge"
          location_found: "library"
          type: "physical"
          discovery_guidance: "Revealed when player searches the floor near Professor Vane's body, examines the ground, or uses Unveil on the scene."
          description: |
            A Scarlet Court library access badge near Professor Vane's body. The name
            engraved: "Elena Marsh." Students need these badges for
            after-hours Sealed Archive access.
          tag: "[EVIDENCE: dropped_badge]"
          significance: "Places Elena at the scene. Dropped during discovery or during the attack?"
          strength: 55
          points_to: ["elena"]
          witness_reactions:
            elena: "I dropped it when I found him! I was in the eastern alcove — I heard a sound, came to investigate, and found him like this. I panicked."
            cassian: "Marsh was there? Of course she was. She had that fight with Professor Vane — everyone saw it. Seems obvious to me."
            whitmore: "Miss Marsh had legitimate after-hours access. The badge proves she was there, not that she did anything."
            wisp: "Miss Marsh is a kind scholar. Wisp does not think she would hurt anyone."

        # Scuff marks - no size detail, just direction
        - id: "scuff_marks"
          name: "Scuff Marks on Floor"
          location_found: "library"
          type: "physical"
          discovery_guidance: "Revealed when player examines the floor, looks for tracks, or uses Raise the Lamp to illuminate the scuff marks."
          description: |
            Faint scuff marks on the polished stone floor lead from the ritual
            circle toward the exit. Under Raise the Lamp, they continue down the corridor
            in the direction of the dungeons.

            The stride suggests someone running. The marks are fresh — tonight's.
          tag: "[EVIDENCE: scuff_marks]"
          significance: "Someone fled the scene toward the dungeons. But multiple houses and areas are accessed through lower corridors."
          strength: 45
          points_to: []
          witness_reactions:
            elena: "I didn't go that way. I went toward the main corridor to find help."
            cassian: "Lots of students use that route. Half the castle is accessed through lower corridors. Doesn't mean anything."
            whitmore: "Several houses are reached through lower corridors, not just Iron Lodge. This narrows it but doesn't identify anyone."
            wisp: "Wisp does not leave marks on floors. Bound familiars are very quiet. *says this with odd emphasis*"

        # Singed cloak fiber
        - id: "singed_cloak_fiber"
          name: "Singed Fabric Fiber"
          location_found: "library"
          type: "physical"
          discovery_guidance: "Revealed when player examines the doorframe, investigates the exit, or looks for trace evidence."
          description: |
            A single fiber from a cloak, caught on the doorframe near the exit.
            The fiber is singed — as if exposed to etheric discharge. The color
            is dark green. The weave suggests expensive fabric, not standard
            student robes.
          tag: "[EVIDENCE: singed_cloak_fiber]"
          significance: "Expensive green fabric caught fleeing the scene. Partial evidence."
          strength: 35
          points_to: []
          witness_reactions:
            elena: "Green could be anyone. Iron Lodge students, professors with green robes, even some Candlewicks wear dark green."
            cassian: "I don't own the only green cloak in this school. That's hardly proof of anything."
            whitmore: "The weave is expensive. Not standard-issue. Someone from a wealthy family, perhaps."
            wisp: "Wisp does not wear cloaks. Bound familiars wear... what they are given. *tugs at pillowcase*"

        # Ritual book - proves premeditation
        - id: "ritual_book"
          name: "Open Book on Reading Desk"
          location_found: "library"
          type: "documentary"
          discovery_guidance: "Revealed when player examines the reading desk, investigates the open book, or uses Unveil on the desk area."
          description: |
            The book on the reading desk is open to a chapter titled:
            "Activation Rites for Bound Artifacts"

            The instructions describe a ritual requiring: a circle of seven
            candles, fresh nightshade, and a spoken incantation. A note in the
            margin (elegant handwriting, expensive ink): "Use the nightshade
            from Father's package. Don't let Professor Vane catch you — he'll recognize it."

            Someone was following these instructions. Someone who received a
            package from their father. Someone worried about Professor Vane specifically.
          tag: "[EVIDENCE: ritual_book]"
          significance: "Someone planned a ritual here. The margin note suggests a student with a wealthy father."
          strength: 75
          points_to: ["cassian"]
          witness_reactions:
            elena: "That handwriting isn't mine. It's elegant — aristocratic. And 'Father's package'? Only certain families send packages like that."
            cassian: "*jaw tightens* Anyone could have written that. People write in library books all the time."
            whitmore: "That handwriting is distinctive. I've seen it on essays. *does not name the student yet*"
            wisp: "Wisp has seen young master's handwriting many times. *catches himself* Wisp means... Wisp does not know who wrote that."

        # Elena's book slip - she was ALREADY there
        - id: "elena_book_slip"
          name: "Library Access Slip and Book"
          location_found: "library"
          type: "documentary"
          discovery_guidance: "Revealed when player investigates the eastern alcove, examines the reading chair area, or searches for other occupants."
          description: |
            In the eastern alcove, forty feet from the crime scene, a library slip sits inside a book: "Restricted Access — E. Marsh."

            The book is "Paralytic binding: Causes, Cures, and Controversies." Several pages are bookmarked — chapters on binding magic, deep-binding stare paralysis, and counter-curses.

            The alcove shows signs of recent use — a reading chair slightly displaced, a candle stub that has burned down roughly twenty minutes' worth. The alcove is around a corner from the main scene, separated by towering shelves that muffle sound.
          tag: "[EVIDENCE: elena_book_slip]"
          significance: "Elena was already in the Sealed Archive BEFORE the attack — reading a book about paralytic binding. Innocent research or preparation?"
          strength: 70
          points_to: ["elena"]
          witness_reactions:
            elena: "I was researching paralytic binding because of the UNDERCROFT BREACH attacks! the custodian's raven was found stiff! uninitiated-borns are being targeted! Someone has to understand what's happening — and that book covers counter-curses too!"
            cassian: "She was reading a book about paralytic binding? The same night a professor was frozen? And she was ALREADY there? How much more obvious can it get?"
            whitmore: "The candle burn time is consistent — she was reading for roughly twenty minutes before the incident. The book itself... many students have been researching paralytic binding since the undercroft breach attacks. It's concerning but not conclusive."
            wisp: "Wisp knows Miss Marsh reads a lot. She is always in the library."

        # ATMOSPHERIC: Hawthorne's confiscation log — world-building, the undercroft breach fear
        - id: "hawthorne_confiscation_log"
          name: "Miss Hawthorne's Confiscation Notes"
          location_found: "library"
          type: "documentary"
          discovery_guidance: "Revealed when player searches Miss Hawthorne's desk, examines library records, or investigates the librarian's area."
          description: |
            A clipboard near the library entrance, Miss Hawthorne's neat handwriting:

            "CONFISCATED MATERIALS — This Term:
            - 'Moste Potente Alchemy' — returned to shelf after student inspection (Third-year Scarlet Court, authorized note from Langley)
            - Dark Arts pamphlet circulating in Iron Lodge common room
            - Three students caught trying to access the undercroft breach lore section after hours
            - Graffiti cleaned from shelf: 'SUCCESSION TO THE LODGE WILL PREVAIL'

            NOTE: Increased traffic to paralytic binding-related texts since the attack on the custodian's raven. Half the school seems to be researching it. Sealed Archive requests up 300%."
          tag: "[EVIDENCE: hawthorne_confiscation_log]"
          significance: "Shows the school atmosphere — paralytic binding research is widespread, not unique to any suspect. World context."
          strength: 10
          points_to: []
          witness_reactions:
            elena: "See? EVERYONE is researching paralytic binding. I'm not the only one. The whole school is scared."
            cassian: "Hawthorne confiscates things from everyone. This doesn't mean anything."
            whitmore: "the undercroft breach attacks have the entire school on edge. This is... context, not evidence."
            wisp: "Wisp has heard the students whispering about the undercroft breach. Everyone is frightened."

        # ATMOSPHERIC: Damaged ward stone — shows magical stress from multiple events
        - id: "damaged_ward_stone"
          name: "Stressed Ward Stone"
          location_found: "library"
          type: "magical"
          discovery_guidance: "Revealed when player examines the library entrance carefully, casts Identify Substance on the doorway, or investigates the magical protections."
          description: |
            A small ward stone embedded in the doorframe of the Sealed Archive shows hairline fractures. Identify Substance reveals it has been stressed by multiple magical events — not just tonight's.

            The stone's protective enchantments are weakened. Whatever protections the Sealed Archive once had against unauthorized magic have been failing for weeks. The undercroft breach attacks have strained Blackwood Collegiate's wards throughout the castle.

            Tonight's etheric discharge was the final blow to this stone.
          tag: "[EVIDENCE: damaged_ward_stone]"
          significance: "The castle's wards are weakening from the undercroft breach attacks. The Sealed Archive had degraded protections — anyone could have performed magic here undetected."
          strength: 15
          points_to: []
          witness_reactions:
            elena: "The wards are failing? That explains why no alarm went off when... when whatever happened here happened. the undercroft breach attacks are draining the castle's magic."
            cassian: "Ward stones break all the time in old castles. This building is a thousand years old."
            whitmore: "I... was not aware the wards had degraded this far. This is deeply concerning. It means we have no magical record of who entered tonight."
            wisp: "Bound familiars can feel when the castle is hurting. The magic has been... wrong... for weeks."

      not_present:
        - triggers:
            - "secret passage"
            - "hidden door"
            - "escape route"
          response: "The walls are solid stone. No hidden passages here — just shelves and books."
        - triggers:
            - "hand of glory"
            - "the artifact"
            - "cursed object"
          response: "Whatever artifact was used here, it's gone. Whoever fled took it with them."

    # =========================================================================
    # Location 2: Iron Lodge Common Room
    # =========================================================================
    iron_lodge_common_room:
      id: "iron_lodge_common_room"
      name: "Iron Lodge Common Room"
      type: "micro"

      description: |
        Professor Whitmore's authorization spell tingles at your wrist —
        temporary access for the investigation. The stone wall slides open.
        You're not welcome here. Every surface reminds you.

        The common room of Blackwood's old Iron Lodge house stretches beneath the
        Greymere. Green light filters through windows looking into murky water.
        Leather armchairs surround a dying fireplace. Most students are in bed.

        Cassian Thorne's corner is unmistakable — the most expensive armchair, worn
        from habitual use. His trunk sits nearby, closed, silver "CT" monogram
        catching the green light. A writing desk holds mundane correspondence.

        The smell of something herbal lingers near the trunk. Faint. Familiar.

      surface_elements:
        - "Green-tinted lake windows casting eerie light"
        - "Leather armchairs near dying fireplace, one worn more than others"
        - "Writing desk with mundane correspondence"
        - "Cassian Thorne's trunk — closed, silver 'DM' monogram"
        - "Faint herbal smell near the trunk area"
        - "A few students still awake, watching you with cold curiosity"

      witnesses_present: []

      spell_contexts:
        available_spells:
          - "unveil"
          - "sense_presence"
          - "raise_the_lamp"
          - "identify_substance"
        special_interactions:
          unveil:
            targets:
              - "trunk"
              - "cassian's trunk"
              - "cassian's belongings"
              - "thorne's things"
            reveals_evidence:
              - "torn_letter"
              - "stolen_nightshade"
          identify_substance:
            targets:
              - "trunk"
              - "cassian's things"
              - "robes"
            reveals_evidence:
              - "residual_dark_magic"

      hidden_evidence:
        # Magnus's letter - connects Thief's Candle to Cassian
        - id: "torn_letter"
          name: "Letter from Lord Magnus Thorne"
          location_found: "iron_lodge_common_room"
          type: "documentary"
          discovery_guidance: "Revealed when player searches Cassian's trunk, uses Unveil on it, or investigates Cassian's belongings."
          description: |
            Hidden beneath Cassian's robes in his trunk — a letter on expensive
            parchment, partially burned at the edges. The Thorne family crest
            is visible:

            "Cassian,

            The package has arrived. A genuine Thief's Candle — one of three
            known to exist. Your grandfather used it during the first war.

            The activation ritual is in the Sealed Archive. You'll need
            fresh nightshade. I've included some, but if you need more, Professor Vane
            keeps stores in his office. Be careful — Aldric will recognize
            the artifact.

            Make our family proud.
            — Father"

            The letter is dated four days ago.
          tag: "[EVIDENCE: torn_letter]"
          significance: "Connects Cassian to the Thief's Candle and the ritual. His father sent it."
          strength: 90
          points_to: ["cassian"]
          witness_reactions:
            elena: "Lord Magnus Thorne sent his son an illegal cursed artifact? That's... that's criminal. But it proves Cassian was doing a ritual, not necessarily that he attacked Professor Vane."
            cassian: "*defeated* Fine. Father sent me the Thief's Candle. It's a family heirloom. I was trying to activate it. That's all."
            whitmore: "Lord Magnus Thorne. Of course. The apple doesn't fall far from the tree. But this letter also warns Cassian about Professor Vane — he knew Professor Vane would try to stop it."
            wisp: "*trembling* Old Lord Magnus... he sent many things to young master. Wisp... Wisp was not the only thing he sent."

        # Stolen nightshade in Cassian's trunk
        - id: "stolen_nightshade"
          name: "Stolen Nightshade"
          location_found: "iron_lodge_common_room"
          type: "physical"
          discovery_guidance: "Revealed when player searches Cassian's trunk or notices the herbal smell near his things."
          description: |
            Inside Cassian's trunk, hidden beneath robes: a pouch of dried
            nightshade with "Professor Vane's Private Stores" stamped on the fabric.
            The same type of nightshade scattered at the crime scene.

            This is from a SECOND theft — the one that happened yesterday,
            after the apology note. The note only explains the first theft.
          tag: "[EVIDENCE: stolen_nightshade]"
          significance: "Cassian committed the second theft. Connects him to ritual ingredients."
          strength: 80
          points_to: ["cassian"]
          witness_reactions:
            elena: "Two separate thefts. The note was from three days ago — this is from yesterday. Different thieves, different purposes."
            cassian: "I... Father's supply wasn't enough. I needed more for the ritual. I was going to replace it."
            whitmore: "Two thefts. The first was Wisp's — he confessed. The second was someone else entirely. Now we know who."
            wisp: "Wisp only stole ONCE! This is not Wisp's! Someone else took more nightshade!"

        # Forbidden craft residue on Cassian's things
        - id: "residual_dark_magic"
          name: "Dark Magic Residue"
          location_found: "iron_lodge_common_room"
          type: "magical"
          discovery_guidance: "Revealed when player casts Identify Substance on Cassian's trunk or belongings."
          description: |
            Identify Substance reveals traces of forbidden craft on Cassian's trunk
            lining and robes. The signature has a cold, blue-white quality
            that matches the frost at the crime scene.

            Whatever was stored here was saturated with the same energy
            that left frost on the library floor.
          tag: "[EVIDENCE: residual_dark_magic]"
          significance: "The source of the frost pattern was stored in Cassian's trunk. Links artifact to Cassian."
          strength: 80
          points_to: ["cassian"]
          witness_reactions:
            elena: "The cold signature matches the crime scene frost. Whatever caused that frost was kept here."
            cassian: "Yes, the Thief's Candle was in my trunk. I already admitted that. What more do you want?"
            whitmore: "The magical residue is consistent with the library frost. This confirms Cassian brought the artifact."
            wisp: "Forbidden craft... Wisp has felt that cold before. In the old manor. Bad things lived in that house."

        # Student witness testimony — more divided
        - id: "student_testimony"
          name: "Iron Lodge Student Accounts"
          location_found: "iron_lodge_common_room"
          type: "testimonial"
          discovery_guidance: "Revealed when player questions Iron Lodge students about that night."
          description: |
            Students give conflicting accounts:

            "Cassian left before curfew, maybe quarter to ten? Carrying something
            wrapped in cloth. Said he was 'going to study.' Nervous, but excited."

            "He came back not long after. White as a ghost, hands shaking."

            But Pansy Parkinson insists: "He was just carrying books. His father
            sends him rare books all the time. And he came back much later — I was
            almost asleep. You're all exaggerating."

            Another student: "Pansy wasn't even in the common room when he left.
            She's covering for him."

            "When Pansy asked if he was okay, he snapped at her. Said something
            like 'It wasn't supposed to happen like that.' Then locked himself in."
          tag: "[EVIDENCE: student_testimony]"
          significance: "Students place Cassian leaving and returning, but accounts conflict on timing and details."
          strength: 65
          points_to: ["cassian"]
          witness_reactions:
            elena: "Conflicting witness accounts are normal. But they all agree on one thing — he came back terrified. Something happened to him."
            cassian: "They don't know what they saw. Pansy's right — I was carrying books. *less convincing each time*"
            whitmore: "Student testimony is unreliable on specifics but reliable on emotional states. They all agree Cassian was terrified when he returned."
            wisp: "Wisp... Wisp also saw young master leaving that night. *whispered*"

        # ATMOSPHERIC: Cassian's unsent letter — character depth, family pressure
        - id: "cassian_unsent_letter"
          name: "Cassian's Unsent Letter"
          location_found: "iron_lodge_common_room"
          type: "documentary"
          discovery_guidance: "Revealed when player examines Cassian's writing desk, searches his correspondence, or investigates the desk area."
          description: |
            A crumpled, unsent letter on Cassian's writing desk, in his handwriting:

            "Father,

            I have the package. I understand what is expected of me. I will not disappoint you.

            But I wanted to ask — did Grandfather really use this during the war? Did he ever"

            The letter stops mid-sentence. Several words are crossed out below: "hurt anyone" is scratched through twice. The parchment is wrinkled as if gripped tightly.

            He never finished it. He never sent it.
          tag: "[EVIDENCE: cassian_unsent_letter]"
          significance: "Cassian had doubts. He was scared of the artifact but couldn't admit it to his father. A child under pressure."
          strength: 20
          points_to: ["cassian"]
          witness_reactions:
            elena: "He was scared. He was asking if his grandfather hurt anyone with it and he couldn't even finish the question. *quietly* He's twelve years old."
            cassian: "*snatches at the letter* That's PRIVATE. You have no right— *voice breaks* Give it back."
            whitmore: "*reads it slowly, expression softening* He was frightened. A child asking his father a question he couldn't bear to hear answered."
            wisp: "Young master... young master was always trying to make old master proud. Even when it scared him."

      not_present:
        - triggers:
            - "hand of glory"
            - "the artifact"
            - "cursed object"
          response: "If the Thief's Candle was here, it's been hidden or disposed of. It's not in the trunk or anywhere visible."

    # =========================================================================
    # Location 3: Third Floor Corridor (Witness location)
    # =========================================================================
    third_floor_corridor:
      id: "third_floor_corridor"
      name: "Third Floor Corridor"
      type: "micro"

      description: |
        The third-floor corridor outside the archive. Torches flicker in wall
        sconces, casting long shadows across worn flagstones. A window at the
        far end offers a clear view of the grounds.

        This is Professor Whitmore's patrol route. From here, she can see the library
        doors, the stairway to the dungeons, and the main corridor. A portrait
        of a dozing initiate hangs near the library entrance.

      surface_elements:
        - "Flickering torches in wall sconces"
        - "Window overlooking moonlit grounds"
        - "Stone floor showing faint patrol wear patterns"
        - "Portrait of a dozing initiate near library entrance"
        - "Clear sight lines to library doors and dungeon stairs"
        - "Scuff marks near the wall where Professor Vane cornered Elena that afternoon"

      witnesses_present: ["whitmore"]

      spell_contexts:
        available_spells:
          - "unveil"
          - "sense_presence"
          - "raise_the_lamp"

      hidden_evidence:
        # Witness account of afternoon confrontation
        - id: "hallway_confrontation"
          name: "Witness Account: Afternoon Confrontation"
          location_found: "third_floor_corridor"
          type: "testimonial"
          discovery_guidance: "Revealed when player asks about earlier events, investigates what happened before the attack, or questions about Elena and Professor Vane."
          description: |
            Multiple students witnessed an incident around 4 PM:

            "Professor Vane cornered Marsh right here. He was furious — said something
            about 'unauthorized combat instruction' and 'immediate expulsion.'
            Marsh looked terrified, then angry. She said 'You can't do this!'
            and ran off."

            "Professor Vane called after her: 'Tomorrow morning, Miss Marsh. The
            Headmaster will hear everything.'"

            "Marsh was crying in the library afterward. She was there for hours."
          tag: "[EVIDENCE: hallway_confrontation]"
          significance: "Establishes Elena had strong motive. But motive isn't proof."
          strength: 60
          points_to: ["elena"]
          witness_reactions:
            elena: "Yes, it happened. Everyone saw it. I know how it looks. But I was researching my DEFENSE, not planning an attack!"
            cassian: "Marsh's been sneaking around tutoring Ashford combat cantrips. Professor Vane caught her. She had every reason to want him silenced."
            whitmore: "The confrontation was... harsh, even by Aldric's standards. I was planning to mediate the next morning. Miss Marsh was upset, but I know her. She fights with words and precedents, not curses."
            wisp: "Professor Aldric Vane was very angry that day. Wisp heard shouting from the corridor."

        # NEW: Magnus's order to Wisp
        - id: "magnus_order"
          name: "Torn Parchment Fragment"
          location_found: "third_floor_corridor"
          type: "documentary"
          discovery_guidance: "Revealed when player searches the corridor floor near the library entrance, examines the area thoroughly, or uses Unveil on the corridor."
          description: |
            A torn piece of parchment found under a bench near the library entrance. Written in a cramped, formal hand — older than a student's:

            "...the boy is undertaking important family business. You are to ensure he is not harmed, caught, or interfered with. Protect him at all costs. Do not..."

            The rest is torn away. The parchment is expensive, the ink is high quality. This was written by someone wealthy, giving instructions to someone else about protecting a boy.
          tag: "[EVIDENCE: magnus_order]"
          significance: "Someone was given orders to protect a boy 'at all costs.' Who wrote this? Who received it? Which boy?"
          strength: 85
          points_to: []
          witness_reactions:
            elena: "'Important family business'? 'Protect him at all costs'? Someone knew this was going to happen and sent a... protector. *pauses* Who would Lord Magnus Thorne give such orders to?"
            cassian: "*goes pale, long silence* Father sent someone to watch me? I didn't... I didn't know about this."
            whitmore: "This is Lord Magnus Thorne's handwriting. I recognize it from his board correspondence. He was giving instructions to someone — but to whom?"
            wisp: "*silence, then tries to bite his own hand before stopping* Wisp... Wisp cannot say. Please. *shaking violently*"

        # ATMOSPHERIC: Prefect patrol notes — explains security gaps
        - id: "prefect_patrol_notes"
          name: "Prefect Patrol Schedule"
          location_found: "third_floor_corridor"
          type: "documentary"
          discovery_guidance: "Revealed when player examines the corridor notice board, investigates patrol schedules, or asks about security."
          description: |
            A patrol schedule pinned to a small notice board near the stairs:

            "PREFECT PATROLS — Modified Schedule (undercroft breach emergency):
            Third Floor Corridor: Reduced to hourly checks.
            Lower vaults: DOUBLED patrols (breach point suspected nearby).
            Library Wing: Coverage SUSPENDED after 9 PM — insufficient prefects. Professor staff patrol only.

            NOTE FROM HEAD BOY: With half the prefects refusing night patrol after the undercroft breach attacks, we cannot guarantee full corridor coverage. Report any suspicious activity to Professor Whitmore or Professor Langley."

            The library wing had no prefect coverage after 9 PM. Only Professor Whitmore's patrol route passed this corridor.
          tag: "[EVIDENCE: prefect_patrol_notes]"
          significance: "Security gaps explain how multiple people accessed the Sealed Archive undetected. The undercroft breach attacks weakened school security."
          strength: 15
          points_to: []
          witness_reactions:
            elena: "Half the prefects refusing patrol? I didn't know it was that bad. No wonder the corridor was empty."
            cassian: "If there were proper patrols, none of this would have... *stops himself*"
            whitmore: "I've been stretching the staff thin trying to cover the gaps. the undercroft breach situation has consumed our resources. This corridor only had my patrol — and I can't be everywhere."
            wisp: "Bound familiars see the empty corridors at night. The castle feels... abandoned after dark now."

      not_present:
        - triggers:
            - "blood"
            - "evidence of struggle"
          response: "No signs of violence here. Whatever happened was inside the Sealed Archive."

    # =========================================================================
    # Location 4: Blackwood Collegiate Kitchens (Wisp's location)
    # =========================================================================
    kitchens:
      id: "kitchens"
      name: "Blackwood Collegiate Kitchens"
      type: "micro"

      description: |
        You ring the brass service bell beside the warded pantry hatch. It chimes
        twice, low and resonant, and the hatch unlatches — service access to the
        kitchens below the refectory.

        The vast Blackwood Collegiate kitchens stretch before you, directly below the Great
        Hall. Brass pots and pans hang from the ceiling, gleaming in the firelight
        of a dozen hearths. Bound familiars bustle about even at this hour.

        In the corner near the hospital wing corridor, you spot a small bound familiar with
        tennis-ball-sized green eyes. Wisp. He sits beside a makeshift cot where
        another bound familiar — Pippa — rests under a patchwork blanket. His corner is
        neater than the others. Mismatched socks displayed proudly on a small shelf.

        He looks up as you approach. His ears droop. He knows why you're here.

        You notice his hands are wrapped in cloth bandages. Unusual for a
        bound familiar who uses magic, not manual labor.

      surface_elements:
        - "Brass cookware hanging from ceiling"
        - "Four long preparation tables"
        - "Busy bound familiars working quietly"
        - "Small cot with Pippa resting under patchwork blanket"
        - "Wisp sitting beside his friend, ears drooping"
        - "Wisp's hands wrapped in cloth bandages"
        - "Kitchen log book hanging by the door"
        - "Wisp's corner: neater than most, mismatched socks displayed"

      witnesses_present: ["wisp"]

      spell_contexts:
        available_spells:
          - "unveil"
          - "sense_presence"
          - "raise_the_lamp"
          - "identify_substance"
        special_interactions:
          unveil:
            targets:
              - "wisp's belongings"
              - "corner"
              - "cot area"
              - "log"
              - "kitchen log"
            reveals_evidence:
              - "healing_supplies"
              - "kitchen_log"
          identify_substance:
            targets:
              - "wisp"
              - "wisp's hands"
              - "bandages"
            reveals_evidence:
              - "wisp_frostbite"

      hidden_evidence:
        - id: "healing_supplies"
          name: "Wisp's Healing Supplies"
          location_found: "kitchens"
          type: "physical"
          discovery_guidance: "Revealed when player examines Wisp's area, searches near Pippa's cot, or uses Unveil on the corner."
          description: |
            Near Pippa's cot: a small cauldron with the remnants of a healing
            potion, a mortar and pestle, and an empty pouch labeled "Nightshade —
            Professor Vane's Private Stores."

            The potion residue is clearly medicinal — a standard restorative
            brew. The nightshade was used for healing, exactly as Wisp claimed.

            This is the ONLY stolen nightshade here. No second theft supplies.
          tag: "[EVIDENCE: healing_supplies]"
          significance: "Confirms Wisp used the nightshade for healing. Only accounts for the first theft."
          strength: 60
          points_to: []
          witness_reactions:
            elena: "This proves Wisp's theft was for medicine. But it also proves the second theft wasn't him — someone else needed nightshade for something else."
            cassian: "So the familiar stole for medicine. That doesn't clear him of anything else."
            whitmore: "This confirms what Wisp told me. His theft was innocent. The second theft is the one connected to the attack."
            wisp: "See! Wisp used it for Pippa! Wisp is not a bad familiar! *relief, but still anxious about something else*"

        # NEW: Kitchen log showing Wisp's absence
        - id: "kitchen_log"
          name: "Kitchen Duty Log"
          location_found: "kitchens"
          type: "documentary"
          discovery_guidance: "Revealed when player examines the kitchen log, asks about Wisp's whereabouts, or uses Unveil on the log book."
          description: |
            The kitchen duty log tracks bound familiar movements for accountability.
            Tonight's entries for Wisp:

            "Wisp — kitchen duty: 8:00 PM - 9:58 PM"
            "Wisp — departed: 9:58 PM (personal errand)"
            "Wisp — returned: 10:09 PM"

            An eleven-minute absence. The attack on Professor Vane happened at 10:02 PM.
            Wisp left two minutes before and returned seven minutes after.
          tag: "[EVIDENCE: kitchen_log]"
          significance: "Wisp was absent from the kitchens during the exact window of the attack. Where was he?"
          strength: 90
          points_to: ["wisp"]
          witness_reactions:
            elena: "He left at 9:58 and came back at 10:09? The attack was at 10:02. That's... *looks at Wisp with dawning horror*"
            cassian: "So the familiar wasn't in the kitchens? Where was he then? *doesn't connect the dots yet*"
            whitmore: "Eleven minutes. The timeline is... concerning. Wisp, where exactly did you go during that time?"
            wisp: "*ears flatten completely* Wisp was... Wisp was checking on young master Cassian's rooms. Making sure everything was clean. *the Iron Lodge dormitory is in the wrong direction from the library*"

        # NEW: Wisp's frostbitten hands
        - id: "wisp_frostbite"
          name: "Wisp's Frostbitten Hands"
          location_found: "kitchens"
          type: "physical"
          discovery_guidance: "Revealed when player examines Wisp's bandaged hands, casts Identify Substance on them, or asks about the bandages."
          description: |
            Beneath the cloth bandages, Wisp's knuckles and fingertips show
            frostbite damage — blistered, discolored skin consistent with
            extreme cold exposure.

            Identify Substance on the frostbite reveals traces of two magical
            signatures: the same blue-white cold from the crime scene frost,
            and a yellowish-green shimmer — bound familiar magic.

            Wisp's hands were exposed to both the artifact's cold discharge
            AND his own magic at very close range.
          tag: "[EVIDENCE: wisp_frostbite]"
          significance: "Physical proof that Wisp was in close proximity to both the artifact discharge and bound familiar magic — simultaneously."
          strength: 95
          points_to: ["wisp"]
          witness_reactions:
            elena: "Frostbite with BOTH signatures? He was right there when it happened. Right there. And he used his own magic at the same time. *voice shaking* Oh no."
            cassian: "The familiar has frostbite? From the cold? But that means he was... *slowly understanding* He was THERE?"
            whitmore: "*very quietly* The dual signature on his hands matches the dual signature on Aldric. Wisp... what did you do?"
            wisp: "*covers hands, begins rocking* Wisp is a bad familiar. Wisp is a very bad familiar. But Wisp had to... Master said... *breaks down*"

        # ATMOSPHERIC: Bound familiar working conditions — world-building for bound familiar subplot
        - id: "familiar_duty_roster"
          name: "Bound-Familiar Duty Roster"
          location_found: "kitchens"
          type: "documentary"
          discovery_guidance: "Revealed when player examines the kitchen notice board, asks about bound familiar schedules, or investigates working conditions."
          description: |
            A duty roster pinned near the kitchen entrance, written in a
            large, careful hand (likely a senior bound familiar):

            "KITCHEN DUTIES — This Week:
            Breakfast prep: 4:00 AM — Pippa, Tibby, Nob
            Lunch service: All hands
            Dinner service: All hands
            Night cleaning: Wisp (volunteered), Grimble (assigned)
            Laundry: Rotating — see Headcount

            HEADCOUNT NOTE: Pippa still recovering. Wisp covering her shifts plus his own. Management reminds: bound familiars do not require rest periods. Bound familiars do not require days off. Bound familiars serve.

            WISP'S ANNOTATION (in shaky handwriting at the bottom):
            'Pippa DOES need rest. Wisp will work extra.'"

            The annotation is touching — and telling. Wisp cares about his fellow familiars in a way the system doesn't allow for.
          tag: "[EVIDENCE: familiar_duty_roster]"
          significance: "Shows bound familiar working conditions and Wisp's compassion. He's overworked, caring for Pippa, AND following Magnus's orders. World-building for the bound familiar subplot."
          strength: 10
          points_to: []
          witness_reactions:
            elena: "They don't require REST PERIODS? They don't require DAYS OFF? This is... this is slavery. That's exactly what it is. *genuinely angry*"
            cassian: "Bound familiars don't need rest. They like working. Father says they're happiest when they're useful."
            whitmore: "The bound familiar system is... complex. I'm not comfortable with it, but it's deeply embedded in initiate tradition. Wisp's note, though — that shows something unusual. Compassion between bound familiars."
            wisp: "Wisp just wants Pippa to feel better. The other bound familiars say Wisp is strange for caring. But Wisp cannot help it."

      not_present:
        - triggers:
            - "cursed artifact"
            - "hand of glory"
            - "ritual materials"
          response: "The kitchens are full of cooking supplies, not cursed artifacts. Bound familiars have no use for such things."

  # ---------------------------------------------------------------------------
  # WITNESSES
  # ---------------------------------------------------------------------------
  witnesses:
    # =========================================================================
    # Witness 1: Elena Marsh (Red Herring — looks guilty early)
    # =========================================================================
    - id: "elena"
      name: "Elena Marsh"
      description: |
        Brilliant third-year Scarlet Court, top of her class. Speaks quickly when
        nervous, becomes defensive when accused. Was in the Sealed Archive the
        night of the attack. Professor Vane had publicly confronted her earlier that day.
      personality: |
        Brilliant, rule-conscious, but fiercely loyal to friends. Speaks quickly
        when nervous, becomes defensive when accused. Currently terrified — not just
        of being blamed, but of losing everything she's worked for. She knows how
        guilty she looks. Her only defense is the truth, but the truth incriminates
        her friend Rowan.

      background: |
        Third-year Scarlet Court, top of her class. With the the undercroft breach attacks terrorizing uninitiated-borns, Elena has been secretly researching paralytic binding — both to understand the threat and to teach defensive spells to vulnerable students. She's been teaching Rowan Ashford Binding Cantrip and Ward Cantrip after Iron Lodges repeatedly hexed him.

        Professor Vane caught Rowan practicing, forced him to confess, and confronted Elena that afternoon. He threatened to have them both expelled.

        That evening, she went to the Sealed Archive to research both her disciplinary defense AND paralytic binding countermeasures. She was reading "Paralytic binding: Causes, Cures, and Controversies" — a book that covers everything from deep-binding stares to binding magic. She entered the eastern alcove — forty feet from the crime scene, around a corner — and was deep in research when the attack happened. She heard a muffled sound but assumed it was students. Minutes later, she investigated and found Professor Vane frozen.

        She saw a cloaked figure disappearing toward the exit but couldn't identify them.

      wants: "Prove her innocence without getting Rowan expelled for the lessons she taught him"
      fears: "Being expelled, being blamed for Professor Vane's attack, Rowan being punished, the undercroft breach attacks"
      moral_complexity: |
        Elena looks genuinely guilty. She had motive (expulsion threat), opportunity (present in the Sealed Archive), and was actively researching paralytic binding magic — the exact type of attack used on Professor Vane. Her focus shows Binding Cantrip cast that same day.

        But she's innocent. Her paralytic binding research was driven by fear of the undercroft breach attacks, and her spells were for Rowan's lessons. She arrived in the alcove before the attack and was reading when it happened.

        Her real dilemma: tell the whole truth and condemn Rowan, or withhold details and look even more suspicious. The paralytic binding book makes things worse — it looks like she was studying how to do exactly what happened to Professor Vane.

      base_trust: 55
      mind_shield_skill: 0

      knowledge:
        - "I was in the Sealed Archive that evening, in the eastern alcove"
        - "I found Professor Aldric Vane already frozen near the ritual circle"
        - "I saw someone leaving — a cloaked figure heading toward the exit. I couldn't see their face."
        - "My library badge must have fallen when I discovered the body and panicked"
        - "Yes, Professor Vane confronted me that afternoon. Everyone saw it. I know how it looks."
        - "I was reading about paralytic binding. With the undercroft breach attacks, someone has to understand what's happening to uninitiated-borns."

      secrets:
        - id: "tutoring_a_peer"
          trigger: "trust>50"
          risk_type: "protective"
          risk_level: "high"
          why_hiding: "Confirms motive for Professor Vane confrontation"
          text: |
            Taught Rowan defensive spells (Binding Cantrip, Ward Cantrip) because Iron Lodges kept hexing him. Professor Vane caught Rowan practicing, forced him to name his teacher. That's why Professor Vane confronted me.
          keywords:
            - "tutoring rowan"
            - "defensive magic lessons"
            - "iron lodge hexing"

        - id: "vane_threat_detail"
          trigger: "trust>60 OR evidence:hallway_confrontation"
          risk_type: "self_incriminating"
          risk_level: "high"
          why_hiding: "Establishes clear motive"
          text: |
            Professor Vane threatened to go to Headmaster Ashford next morning, said I'd be expelled by noon. I was furious, said I'd "stop him somehow" — meant legally, building a case. Sounds incriminating.
          keywords:
            - "expelled by noon"
            - "stop him somehow"

        - id: "focus_evidence"
          trigger: "trust>55 OR evidence:elena_focus_check"
          risk_type: "self_incriminating"
          risk_level: "medium"
          why_hiding: "Focus shows paralytic binding magic"
          text: |
            Cast Binding Cantrip multiple times that day teaching Rowan in an empty classroom. But Binding Cantrip signature is completely different from whatever froze Professor Vane — simple body-bind vs. unknown magic.
          keywords:
            - "binding cantrip teaching"
            - "different signature"

        - id: "saw_fleeing_figure"
          trigger: "trust>70"
          risk_type: "protective"
          risk_level: "medium"
          why_hiding: "Won't accuse without proof"
          text: |
            Glimpsed a figure leaving — hooded cloak, expensive fabric, moving toward the dungeons. Couldn't see face. Won't accuse based on a glimpse.
          keywords:
            - "hooded cloak"
            - "toward dungeons"

        - id: "bound_familiar_magic_theory"
          trigger: "trust>65 AND evidence:dual_shimmer"
          risk_type: "none"
          risk_level: "low"
          why_hiding: "Disturbing conclusion she's unsure of"
          text: |
            The yellowish-green shimmer on Professor Vane matches bound familiar binding magic per 'Magical Beings and Their Powers.' Bound familiars use it to restrain threats to masters — stronger than most initiate spells. Implies someone with bound familiar magic was present and acted after the artifact discharge.
          keywords:
            - "bound familiar binding"
            - "yellowish-green"
            - "second signature"

      lies:
        - condition: "trust<40"
          topics:
            - "why were you there"
            - "what were you doing"
            - "sealed archive"
          response: "I was researching. Advanced Transmutation theory. Nothing unusual."

    # =========================================================================
    # Witness 2: Cassian Thorne (Believes he's guilty — but isn't fully)
    # =========================================================================
    - id: "cassian"
      name: "Cassian Thorne"
      description: |
        Third-year Iron Lodge with an arrogant exterior. Son of Lord Magnus Thorne.
        Becomes hostile under pressure. Connected to a cursed artifact found near
        the crime scene.
      personality: |
        Arrogant exterior hiding genuine terror. Crushed by pressure to uphold
        family legacy. Currently experiencing the worst night of his life — he
        believes he froze Professor Vane. He's not evil. He's a scared teenager who
        thinks he made a catastrophic mistake.

        His deflection toward Elena is learned behavior from Magnus, not
        calculated conspiracy. He genuinely believes pointing at her protects
        himself.

      background: |
        Third-year Iron Lodge. His father sent him a Thief's Candle with instructions
        to activate it. Cassian stole nightshade from Professor Vane's stores to complete the
        ritual. He snuck to the Sealed Archive and began the activation.

        Professor Vane caught him mid-ritual and tried to safely cancel it with Dispel.
        The interruption destabilized the magic. The Thief's Candle
        discharged — cold, frost, a wave of energy. Professor Vane staggered but was still
        moving, still reaching for Cassian. Cassian fled in panic.

        He does NOT know Wisp was there. He does NOT know that Professor Vane was still
