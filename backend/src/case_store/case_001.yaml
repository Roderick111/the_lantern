  # ---------------------------------------------------------------------------
  # SOLUTION
  # ---------------------------------------------------------------------------
  solution:
    culprit: "wisp"
    method: "Bound familiar binding magic applied on top of Thief's Candle discharge. Cassian's ritual stunned Professor Vane; Wisp's magic completed the paralytic binding. Two spells layered together."
    motive: "Slavery. Lord Magnus Thorne ordered Wisp to protect Cassian at all costs. When Professor Vane tried to stop Cassian's ritual, Wisp followed his master's orders. He didn't intend permanent paralytic binding — the two magics combining was unintended."

    key_evidence:
      - "dual_shimmer" # Two magic types on Professor Vane — proves two attackers
      - "kitchen_log" # Wisp absent during exact attack window
      - "wisp_frostbite" # Physical proof Wisp was at the scene
      - "magnus_order" # Proves Wisp was acting under orders
      - "focus_signature" # Proves Professor Vane was trying to help, not attack
      - "frost_pattern" # Thief's Candle discharge (Cassian's contribution)
      - "torn_letter" # Connects Thief's Candle to Cassian
      - "elena_book_slip" # Clears Elena (she was reading in the alcove)

    deductions_required:
      - "Two magic types on Professor Vane prove two separate magical events, not one"
      - "Cassian's confession: Professor Vane was still moving when he fled — something finished the job"
      - "Kitchen log: Wisp was absent during the exact attack window"
      - "Wisp's frostbite: physical proof he was at the scene during both magical events"
      - "Magnus's parchment: orders to protect Cassian — Wisp was following master's commands"
      - "Bound familiar binding magic matches the second shimmer on Professor Vane"
      - "Elena's timeline and alcove position clear her"
      - "Cassian committed reckless forbidden craft but didn't complete the paralytic binding"
      - "Wisp is a slave — the moral question of responsibility"

    correct_reasoning_requires:
      - "Question the assumption that one magical event caused the paralytic binding"
      - "Recognize the dual signature as evidence of two separate actors"
      - "Use the timeline gap (10:02-10:05) to identify the second actor"
      - "Connect Wisp's physical evidence (frostbite, absence) to the crime"
      - "Understand that bound familiar magic IS powerful enough to bind a initiate"
      - "Recognize that slavery, not malice, motivated Wisp"

    common_mistakes:
      - error: "Accuse Elena"
        reason: "Strong motive, present at scene before attack, practiced paralytic binding magic that day"
        why_wrong: "Was in eastern alcove 40 feet away. Candle burn time proves she didn't move. Her spell signatures don't match. She found Professor Vane AFTER he was already frozen."

      - error: "Accuse Cassian"
        reason: "Performed the ritual, fled the scene, has the artifact, overwhelming physical evidence"
        why_wrong: "Cassian's own confession: Professor Vane was still moving when he fled. The Thief's Candle stunned Professor Vane but didn't fully bind in stillness him. The dual shimmer proves a second magical event completed the job. Cassian is guilty of reckless forbidden craft but not the complete paralytic binding."

      - error: "Rule it an accident"
        reason: "Cassian didn't intend harm, artifact malfunctioned"
        why_wrong: "Two separate magical acts. The Thief's Candle discharge may have been accidental, but the binding magic was deliberate — someone chose to freeze Professor Vane."

    fallacies_to_catch:
      - fallacy: "confirmation_bias"
        example: "Locking onto Elena because she had motive, ignoring timeline and magical evidence"

      - fallacy: "appeal_to_authority"
        example: "Trusting Professor Whitmore's 'cursed artifact discharge' interpretation without questioning the second shimmer"

      - fallacy: "anchoring_bias"
        example: "The evidence avalanche against Cassian makes it hard to consider alternatives even when his confession contradicts his guilt"

      - fallacy: "capability_dismissal"
        example: "Dismissing Wisp because 'bound familiar magic can't do this' — it can, and it did"

  # ---------------------------------------------------------------------------
  # WRONG SUSPECTS
  # ---------------------------------------------------------------------------
  wrong_suspects:
    elena:
      graves_response: |
        GRAVES: "Marsh? You fell for the oldest trick in the book — motive
        blindness. Let me show you where you went wrong.

        Yes, Professor Vane threatened to expel her. Yes, she was in the Sealed
        Stacks. Yes, her focus shows paralytic binding spells.

        But the TIMELINE. She entered at 9:47, sat in the eastern alcove,
        forty feet away. The candle burned twenty minutes before she moved.
        She found Professor Vane AFTER he was already frozen.

        And the MAGIC. Her spells are clean, controlled Binding Cantrip.
        What hit Professor Vane was two different magical effects — an artifact
        discharge AND something else entirely. Marsh couldn't produce
        either one.

        You let a compelling story override the facts. Sloppy."
      why_innocent: "Timeline proves she was reading in the alcove during the attack. Her spell signatures don't match either magical effect on Professor Vane."

    cassian:
      graves_response: |
        GRAVES: "Cassian Thorne. Close, recruit. Very close. But not quite right.

        Yes, Thorne performed the ritual. Yes, his artifact discharged. Yes,
        he fled the scene. He's guilty of reckless forbidden craft — no question.

        But look at the EVIDENCE on Professor Vane. Two magical signatures. Two
        DIFFERENT types of magic. The blue-white frost is the Thief's Candle.
        But that yellowish-green shimmer? That's bound familiar binding magic.

        And Thorne's own confession — he says Professor Vane was STILL MOVING when
        he ran. If his artifact fully froze Professor Vane, why was the victim
        still conscious?

        Someone else was there. Someone finished what the artifact started.
        Someone who was following orders to protect the boy.

        You found the right crime but the wrong criminal. The artifact
        stunned Professor Vane. Something else froze him. Think about who else was
        there that night."
      why_innocent: "Cassian's artifact stunned Professor Vane but didn't fully bind in stillness him. His own confession confirms Professor Vane was still moving. The dual shimmer proves a second magical event — bound familiar magic — completed the paralytic binding."

  # ---------------------------------------------------------------------------
  # POST-VERDICT CONTENT
  # ---------------------------------------------------------------------------
  post_verdict:
    correct:
      confrontation:
        - speaker: "graves"
          text: |
            *Inspector Graves's magical eye fixes on the small figure*

            "Wisp. Step forward."

        - speaker: "wisp"
          text: |
            *Wisp steps forward, trembling. He does not resist. He does not deny.*

            Wisp knew this day would come. Wisp has been waiting.
          tone: "resigned"

        - speaker: "graves"
          text: |
            "You used bound familiar binding magic on Professor Aldric Vane while
            he was trying to save a student from his own stupidity. Your magic
            combined with the artifact's discharge and caused full paralytic binding.

            Is this true?"

        - speaker: "wisp"
          text: |
            *quietly*

            Yes, sir. Wisp did this. Lord Magnus said protect young master
            Cassian. The professor was reaching for him. Wisp... Wisp only
            wanted to hold the professor still for a moment. Just long enough
            for young master to run.

            But Wisp's magic and the cold magic... they mixed. And the
            professor stopped. Completely.

            *tears running down face*

            The professor was trying to HELP young master Cassian. Wisp knows
            that now. The professor's last spell was to SAVE him. And Wisp
            stopped the one person trying to protect his master's son.

            Wisp is the worst familiar who ever lived.
          tone: "broken"

        - speaker: "graves"
          text: |
            *long pause*

            "And Cassian Thorne? He doesn't even know you were there?"

        - speaker: "wisp"
          text: |
            Young master didn't see Wisp. Young master thinks HE did it.
            Young master has been suffering for what he thinks he did.

            *wringing hands*

            That is also Wisp's fault.
          tone: "whisper"

        - speaker: "graves"
          text: |
            *Graves turns to you*

            "Here's the question that doesn't have a clean answer,
            recruit. Wisp is a slave. He was following his master's orders.
            The magic that enslaves him makes disobedience physically painful.

            Can you hold a slave responsible for obeying?

            Lord Magnus Thorne wrote those orders. Magnus sent the artifact. Magnus
            set every piece in motion. And Magnus will face no consequences
            unless someone forces the issue.

            Wisp didn't choose this. But Professor Vane is still frozen in St. Cuthbert's Ward.

            *magical eye spinning*

            There's no clean answer here. Sometimes justice is a question
            without a satisfying response. Write it up, recruit. All of it.
            Let the Occult Bench sort out what we can't."

      aftermath: |
        Wisp was placed under Ministry custody while the Occult Bench debated
        a question it had never seriously considered: can a bound familiar be held
        criminally responsible for actions taken under magical compulsion?

        The trial became a landmark case. Elena Marsh — the student
        Wisp had helped frame by his silence — became his most vocal
        defender, arguing that the real criminals were the institution of
        bound familiar slavery and Lord Magnus Thorne specifically.

        Cassian Thorne was expelled for possession and reckless use of a
        cursed artifact. When he learned that Wisp — not his ritual — had
        actually froze Professor Vane, he sat in silence for a very long time.
        Then he said: "Father sent him to protect me. And I let Professor Vane
        take the blame." It was the first time anyone had seen a Thorne
        express something like shame.

        Lord Magnus Thorne faced an inquiry for providing a dangerous artifact
        to a minor AND for ordering a bound familiar to assault a Blackwood Collegiate
        professor. His political connections reduced consequences, as
        always. But the parchment was entered into public record.

        Professor Aldric Vane was revived after five days in St. Cuthbert's Ward. His
        first words: "Is the Thorne boy safe?" When told the full truth,
        he was quiet for a long time. Then: "The familiar did what any of us
        would have done for someone we're bound to protect. The crime
        isn't his. It's the chain."

        Wisp was eventually freed — not by the Thornes, but by a legal
        precedent established during his trial. He returned to Blackwood Collegiate
        kitchens a free familiar. He never stopped punishing himself for what
        he did to Professor Vane. But now, at least, he could choose.

    incorrect:
      - suspect_accused: "elena"
        reveal: |
          *Inspector Graves shakes his head*

          GRAVES: "Wrong, recruit. You fell for motive blindness.

          Yes, Elena had reason to want Professor Vane stopped. But the TIMELINE
          clears her — she was reading in the eastern alcove when the attack
          happened. The candle burn proves she didn't move.

          And look at Professor Vane's condition. TWO magical signatures. An artifact
          discharge AND bound familiar binding magic. Elena couldn't produce
          either one.

          The real story: Cassian Thorne performed a dark ritual that stunned
          Professor Vane. Then Wisp — following Magnus's orders to protect Cassian —
          used binding magic to finish the job. Two crimes, two perpetrators,
          and a slave who had no choice."

        teaching_moment: |
          You prioritized MOTIVE over EVIDENCE. Elena's story looked
          guilty. But the physical evidence told a different story:
          TIMELINE — She was in the alcove before and during the attack.
          MAGIC — Two signatures on Professor Vane, neither matches her spells.
          POSITION — 40 feet away, around a corner, acoustically separated.

          Lesson: Motive makes someone a suspect. Evidence makes them guilty.

        confrontation_anyway: true

      - suspect_accused: "cassian"
        reveal: |
          *Inspector Graves's eye spins slowly*

          GRAVES: "Close, recruit. Very close. But incomplete.

          Yes, Cassian performed the ritual. Yes, his artifact discharged.
          He's guilty of reckless forbidden craft. But he didn't FINISH the job.

          His own confession: Professor Vane was still MOVING when he fled. The
          Thief's Candle stunned Professor Vane but didn't fully bind in stillness him.

          Look at Professor Vane's skin. TWO magical signatures. The blue-white is
          the artifact. The yellowish-green is bound familiar binding magic.

          Wisp was there. Magnus ordered him to protect Cassian. When Professor Vane
          was still reaching for the boy after the discharge, Wisp used
          binding magic. The two spells layered and caused full paralytic binding.

          You found half the truth. The harder half was hiding in plain sight."

        teaching_moment: |
          You fell for ANCHORING BIAS. The evidence against Cassian was so
          overwhelming that you stopped looking for alternatives — even when
          his own testimony contradicted his guilt.

          Key missed evidence:
          DUAL SHIMMER — Two magic types, not one.
          CASSIAN'S CONFESSION — Professor Vane was still moving when he fled.
          KITCHEN LOG — Wisp absent during the attack window.
          FROSTBITE — Wisp's hands show both magical signatures.

          Lesson: When a suspect's own confession doesn't fully explain the
          evidence, something else happened. Keep looking.

        confrontation_anyway: true

