  # ---------------------------------------------------------------------------
  # POST-VERDICT CONTENT
  # ---------------------------------------------------------------------------
  post_verdict:
    correct:
      confrontation:
        - speaker: "graves"
          text: |
            *Inspector Graves's magical eye fixes on the small figure*

            "Wisp. Step forward."

        - speaker: "wisp"
          text: |
            *Wisp steps forward, trembling. He does not resist.*

            Wisp knew this day would come. He had been waiting.
          tone: "resigned"

        - speaker: "graves"
          text: |
            "You used bound familiar binding magic on Professor Aldric Vane while
            he was trying to save a student from his own stupidity. Your magic
            combined with the artifact's discharge and caused full paralytic binding.

            Is this true?"

        - speaker: "wisp"
          text: |
            *quietly*

            Yes, sir. Wisp did this. Lord Magnus said protect young master Cassian.
            The professor was reaching for him. Wisp wanted to hold the professor
            still long enough for young master to run.

            Wisp's magic met the cold spell. The professor stopped moving.

            *tears running down face*

            The professor was trying to protect young master Cassian. Wisp knows that
            now. He stopped the person who came to save his master's son.

            Wisp cannot forgive himself.
          tone: "broken"

        - speaker: "graves"
          text: |
            *long pause*

            "And Cassian Thorne? He did not know you were there?"

        - speaker: "wisp"
          text: |
            Young master didn't see Wisp. Young master thinks HE did it.
            Young master has been suffering for what he thinks he did.

            *wringing hands*

            That is also Wisp's fault.
          tone: "whisper"

        - speaker: "graves"
          text: |
            *Graves turns to you*

            "Wisp is enslaved and was following his master's orders. The binding makes
            disobedience physically painful. Can the law hold him responsible for
            obeying?

            Lord Magnus Thorne wrote those orders and sent the artifact. His name
            must be in the report. Professor Vane is still frozen in St. Cuthbert's
            Ward, and the Occult Bench will have to face both parts of this case.

            *magical eye spinning*

            Write everything down, recruit. Let the Bench decide what justice means
            here."

      aftermath: |
        Wisp was placed under Ministry custody while the Occult Bench considered
        whether a bound familiar can be held responsible for an act forced by magic.

        The trial became a test of bound familiar law. Elena Marsh, whom Wisp had
        allowed investigators to suspect, defended him in court. She named the
        institution that kept familiars enslaved and Lord Magnus Thorne as the people
        who should answer for the attack.

        Cassian Thorne was expelled for possessing and recklessly using a cursed
        artifact. When he learned that Wisp's spell had completed the binding, he
        sat in silence. Then he said: "Father sent him to protect me. I let Professor
        Vane take the blame." It was the first time anyone had seen a Thorne show shame.

        Lord Magnus Thorne faced an inquiry for giving a dangerous artifact to a minor
        and ordering a bound familiar to assault a Blackwood Collegiate professor.
        His political connections reduced the penalty. The parchment entered the
        public record.

        Professor Aldric Vane was revived after five days in St. Cuthbert's Ward. His
        first words were, "Is the Thorne boy safe?" After hearing the full truth, he
        said, "The familiar did what any of us would have done for someone in our
        care. The crime belongs to the chain."

        Wisp was freed through a legal precedent established during the trial. He
        returned to the Blackwood Collegiate kitchens as a free familiar. He kept
        punishing himself for what he did to Professor Vane, though he could finally
        choose his own work.

    incorrect:
      - suspect_accused: "elena"
        reveal: |
          *Inspector Graves shakes his head*

          GRAVES: "Wrong, recruit. You followed motive and ignored the timeline.

          Elena was reading in the eastern alcove during the attack. The candle burn
          places her there. Professor Vane carries an artifact discharge and bound
          familiar binding magic, and neither signature matches her focus.

          Cassian's ritual stunned Professor Vane. Wisp followed Magnus's order and
          cast the spell that completed the binding."

        teaching_moment: |
          You put MOTIVE ahead of EVIDENCE. The timeline places Elena in the alcove
          before and during the attack. Two signatures mark Professor Vane, and
          neither matches her spells. She was forty feet away around a corner.

          Motive creates a suspect. Evidence establishes what happened.

        confrontation_anyway: true

      - suspect_accused: "cassian"
        reveal: |
          *Inspector Graves's eye spins slowly*

          GRAVES: "Close, recruit. Cassian performed the ritual and his artifact
          discharged. He is guilty of reckless forbidden craft. His own confession
          says Professor Vane was still moving when he fled.

          Professor Vane carries two signatures. The blue-white frost belongs to the
          artifact. The yellow-green shimmer belongs to bound familiar binding magic.
          Wisp followed Magnus's order and completed the paralysis."

        teaching_moment: |
          You fell for ANCHORING BIAS. Cassian's evidence looked complete, so you
          stopped searching. His confession leaves Professor Vane moving after the
          discharge.

          The dual shimmer shows a second spell. The kitchen log places Wisp away
          from his post. Frostbite connects him to the magical discharge.

          When a confession leaves evidence unexplained, keep searching.

        confrontation_anyway: true

  # ---------------------------------------------------------------------------
  # BRIEFING
  # ---------------------------------------------------------------------------
  briefing:
    case_id: "case_001"

    dossier:
      title: "The Sealed Archive"
      victim: "Professor Aldric Vane (Alchemy Master)"
      location: "Blackwood Collegiate Library - Sealed Archive"
      time: "22:00 (Found)"
      status: "Held in stillness / St. Cuthbert's Ward"
      synopsis: |
        Professor Aldric Vane lies motionless beside a circle of melted candles. Frost has
        spread across the sealed windows from within, and scattered herbs stain the floor
        with the sharp scent of nightshade.

        Three people were near the stacks that night. Their stories agree on little.
        The evidence must show what happened to Vane and why the room was sealed.

    teaching_question:
      prompt: "A student with strong motive is found at a crime scene. What should you investigate FIRST?"
      concept_summary: "Physical evidence and timeline are more reliable than motive and behavior."
      choices:
        - id: "choice_a"
          text: "Their motive and opportunity"
          response: |
            *Inspector Graves frowns*

            "Motive and opportunity make someone a suspect. Physical evidence and the
            timeline tell you whether that person caused the injury."

        - id: "choice_b"
          text: "The physical evidence and timeline"
          response: |
            *Inspector Graves nods*

            "Correct. Physical evidence can be misread, so check it against the
            timeline. A neat story fails when the facts contradict it. Evidence can
            also have layers. Check what the first explanation leaves out."

        - id: "choice_c"
          text: "Whether they're acting suspicious"
          response: |
            *Inspector Graves's eye spins*

            "Behavior tells you how frightened someone is. It does not establish who
            cast the spell. Start with the physical record and the timeline."

    rationality_concept: "physical_evidence_primacy"
    concept_description: "Physical evidence and the timeline outrank motive and behavior. Evidence can have layers, so check what the first explanation leaves out."

    transition: |
      *Inspector Graves's magical eye spins, locking onto you*

      Three suspects are tied to the case. Two thefts happened before the attack,
      and more than one spell left a mark.

      Elena argued with the victim. Evidence also links Cassian and Wisp to events
      before the attack.

      Examine the scene and question the witnesses. Inspect the evidence on Professor
