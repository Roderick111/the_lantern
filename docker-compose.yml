# =============================================================================
# Docker Compose - The Lantern Production Stack
# =============================================================================
# Works with nginx-proxy + letsencrypt companion

services:
  # ---------------------------------------------------------------------------
  # Backend - FastAPI + LiteLLM
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lantern-backend
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - saves_data:/app/saves
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lantern-network

  # ---------------------------------------------------------------------------
  # Frontend - React + nginx (handles /api proxy internally)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lantern-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # nginx-proxy config
      - VIRTUAL_HOST=thelantern.institute
      - VIRTUAL_PORT=3000
      # letsencrypt-companion config
      - LETSENCRYPT_HOST=thelantern.institute
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@thelantern.institute}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lantern-network
      - proxy

# -----------------------------------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  saves_data:
    name: lantern-saves

networks:
  lantern-network:
    name: lantern-network
    driver: bridge
  proxy:
    external: true
