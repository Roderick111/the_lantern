# =============================================================================
# Docker Compose - The Lantern Production Stack
# =============================================================================
# Works with nginx-proxy + letsencrypt companion

services:
  # ---------------------------------------------------------------------------
  # Backend - FastAPI + LiteLLM
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lantern-backend
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - saves_data:/app/saves
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lantern-network

  # ---------------------------------------------------------------------------
  # Frontend - React + nginx (handles /api proxy internally)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lantern-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # nginx-proxy config
      - VIRTUAL_HOST=thelantern.institute
      - VIRTUAL_PORT=3000
      # letsencrypt-companion config
      - LETSENCRYPT_HOST=thelantern.institute
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@thelantern.institute}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lantern-network
      - proxy

  # ---------------------------------------------------------------------------
  # Telegram gateway — Hono + grammY + Mini App
  # Host: bot.thelantern.institute (does not affect thelantern.institute)
  # ---------------------------------------------------------------------------
  telegram:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: lantern-telegram
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - TELEGRAM_MODE=webhook
      - PORT=8080
      - VIRTUAL_PORT=8080
      - LANTERN_ENGINE_URL=http://backend:8000
      - TELEGRAM_DB_PATH=/app/data/telegram.db
      - ASSETS_PATH=/app/assets
      - TELEGRAM_PUBLIC_URL=https://bot.thelantern.institute
      # nginx-proxy + acme-companion
      - VIRTUAL_HOST=bot.thelantern.institute
      - LETSENCRYPT_HOST=bot.thelantern.institute
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@thelantern.institute}
    volumes:
      - telegram_data:/app/data
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - lantern-network
      - proxy

# -----------------------------------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  saves_data:
    name: lantern-saves
  telegram_data:
    name: lantern-telegram

networks:
  lantern-network:
    name: lantern-network
    driver: bridge
  proxy:
    external: true
